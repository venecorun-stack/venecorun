<button id="btnTelegram" onclick="unirseTelegram()" style="background-color: #0088cc; color: white; transition: 0.3s;">
    ÚNETE AL CANAL (+1000 pts)
</button>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzOC2xrPJIAUHqoBeyUIzftBinD-xCZgVj7qTudPHN887dZ4o9loW-tEto_IVbdi-SI/exec";

    async function unirseTelegram() {
        // 1. Link de tu canal
        const linkTelegram = "https://t.me/venecoinu"; 
        
        // 2. Abrir el canal en una pestaña nueva
        window.open(linkTelegram, "_blank");

        // 3. Verificar si ya reclamó en esta sesión/dispositivo
        if(localStorage.getItem('tgReclamado') === 'true') {
            alert("Ya reclamaste tus 1000 puntos anteriormente.");
            return;
        }

        // 4. Preparar datos para tu Google Sheets
        const payload = {
            accion: "puntos",
            usuario: localStorage.getItem('venecoUser'),
            wallet: localStorage.getItem('venecoTGID'),
            puntaje: 1000
        };

        // 5. Enviar al script
        try {
            await fetch(URL_SCRIPT, {
                method: "POST",
                mode: "no-cors", // Para evitar errores de política CORS con Google Apps Script
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            // 6. Feedback visual y bloqueo local
            localStorage.setItem('tgReclamado', 'true');
            const btn = document.getElementById("btnTelegram");
            btn.innerText = "¡PUNTOS RECLAMADOS!";
            btn.style.background = "#2ecc71"; // Cambia a verde
            btn.style.cursor = "default";
            
            alert("¡Felicidades! Se han sumado 1000 puntos a tu cuenta de VeneCoin.");
        } catch (e) {
            console.error("Error al procesar puntos:", e);
            alert("Hubo un error al conectar con el servidor, pero el canal se ha abierto.");
        }
    }
</script>
