<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veneco Runner</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #000; color: white; text-align: center; margin: 0; overflow: hidden; }
        #mainMenu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
        button { padding: 15px 25px; font-size: 18px; cursor: pointer; background: #f1c40f; color: #000; border: none; border-radius: 8px; font-weight: bold; width: 250px; }
        button:hover { background: #d4ac0d; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; flex-direction: column; z-index: 100; }
        canvas { display: none; background: #222; }
        #ui { display:none; position: fixed; top: 10px; left: 10px; font-size: 24px; font-weight: bold; color: gold; }
    </style>
</head>
<body>

    <div id="mainMenu">
        <h1 style="color: #f1c40f;">VENECO RUNNER</h1>
        <button onclick="prepararJuego()">JUGAR</button>
        <button onclick="cargarRanking()">RANKING</button>
        
        <button id="btnTelegram" onclick="unirseTelegram()" style="background-color: #0088cc; color: white;">
            CANAL TELEGRAM (+1000 pts)
        </button>

        <button onclick="cerrarSesion()" style="background-color: #c0392b; color: white;">CERRAR SESIÓN</button>
    </div>

    <div id="ui">Puntos: <span id="score">0</span></div>

    <div id="gameOverScreen" class="modal">
        <h2 style="color: #e74c3c;">¡TE HAN ATRAPADO!</h2>
        <p>Puntuación Final: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">VOLVER AL MENÚ</button>
    </div>

    <div id="modalRank" class="modal">
        <h2>TOP PLAYERS</h2>
        <div id="rankList" style="width: 80%; max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
        <button onclick="cerrarModales()">CERRAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // TU URL DE GOOGLE SCRIPT
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzOC2xrPJIAUHqoBeyUIzftBinD-xCZgVj7qTudPHN887dZ4o9loW-tEto_IVbdi-SI/exec";
        
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0, activo = false, vel = 11, obst = [], bgX = 0;
        let imgF = new Image(), imgB = new Image(), imgC = new Image(), imgD = new Image();
        let chig = { x: 50, y: 0, w: 80, h: 80, dy: 0, g: 0.8, salto: -15, suelo: 0, vivo: true };

        // --- FUNCIÓN PARA SUMAR 1000 PUNTOS POR TELEGRAM ---
        async function unirseTelegram() {
            // Reemplaza con el link real de tu canal
            const linkTelegram = "https://t.me/TU_CANAL_AQUI"; 
            window.open(linkTelegram, "_blank");

            // Evitar que reclamen muchas veces en la misma sesión
            if(localStorage.getItem('tgReclamado') === 'true') {
                alert("Ya has reclamado estos puntos.");
                return;
            }

            const payload = {
                accion: "puntos",
                usuario: localStorage.getItem('venecoUser'),
                wallet: localStorage.getItem('venecoTGID'),
                puntaje: 1000
            };

            try {
                // Usamos fetch con modo no-cors para evitar bloqueos del navegador si el script no tiene CORS
                await fetch(URL_SCRIPT, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                localStorage.setItem('tgReclamado', 'true');
                document.getElementById("btnTelegram").innerText = "¡RECOMPENSA RECLAMADA!";
                document.getElementById("btnTelegram").style.background = "#555";
                alert("¡Se han sumado 1000 puntos a tu cuenta!");
            } catch (e) {
                console.log("Error al sumar puntos:", e);
            }
        }

        // --- FUNCIONES DEL JUEGO ---
        async function postData(data) {
            try {
                await fetch(URL_SCRIPT, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
            } catch(e) { console.error("Error en postData", e); }
        }

        async function cargarRanking() {
            abrirModal('modalRank');
            const list = document.getElementById("rankList");
            list.innerHTML = "Cargando...";
            try {
                const res = await fetch(URL_SCRIPT + "?tipo=getRanking&t=" + Date.now());
                const data = await res.json();
                if(data) list.innerHTML = data.map((u, i) => `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333;"><span>${i+1}. ${u.usuario}</span> <b>${u.puntaje} pts</b></div>`).join('');
            } catch(e) { list.innerHTML = "Error al cargar ranking."; }
        }

        function prepararJuego() {
            document.getElementById("mainMenu").style.display = "none";
            canvas.style.display = "block"; 
            document.getElementById("ui").style.display = "block";
            ajustar(); iniciar();
        }

        function ajustar() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
            chig.suelo = window.innerHeight - 200; chig.y = chig.suelo;
            chig.x = (window.innerWidth < 600) ? 30 : 100;
        }

        function iniciar() { activo = true; chig.vivo = true; score = 0; vel = 11; obst = []; bucle(); spawn(); }
        
        function spawn() {
            if(!activo) return;
            obst.push({ x: window.innerWidth + 150, w: 75, h: 85 });
            setTimeout(spawn, Math.max(1100 / (vel * 0.07), 800));
        }

        function bucle() {
            if(!activo && !chig.vivo) return;
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            bgX -= vel * 0.4; if(bgX <= -window.innerWidth) bgX = 0;
            
            // Dibujar Fondos (Si tienes imgF)
            if(imgF.src) ctx.drawImage(imgF, bgX, 0, window.innerWidth, window.innerHeight);

            if(activo) {
                chig.dy += chig.g; chig.y += chig.dy;
                if(chig.y > chig.suelo) { chig.y = chig.suelo; chig.dy = 0; }
                for(let i = obst.length - 1; i >= 0; i--) {
                    obst[i].x -= vel;
                    let bY = chig.suelo + (chig.h - obst[i].h);
                    if(imgB.src) ctx.drawImage(imgB, obst[i].x, bY, obst[i].w, obst[i].h);
                    
                    if (chig.x + 35 < obst[i].x + obst[i].w - 35 && chig.x + chig.w - 35 > obst[i].x + 35 && chig.y + 35 < bY + obst[i].h && chig.y + chig.h - 15 > bY) morir();
                    
                    if(obst[i].x < -200) { 
                        obst.splice(i, 1); 
                        score += 10; 
                        document.getElementById("score").innerText = score; 
                        vel += 0.12; 
                    }
                }
            }
            if(imgC.src) ctx.drawImage(chig.vivo ? imgC : imgD, chig.x, chig.y, chig.w, chig.h);
            requestAnimationFrame(bucle);
        }

        function morir() {
            activo = false; chig.vivo = false;
            postData({ accion: "puntos", usuario: localStorage.getItem('venecoUser'), wallet: localStorage.getItem('venecoTGID'), puntaje: score });
            document.getElementById("finalScore").innerText = score; 
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        const saltar = (e) => { 
            if(e && e.type === "touchstart") e.preventDefault(); 
            if(activo && chig.y >= chig.suelo - 10) { chig.dy = chig.salto; } 
        };
        window.addEventListener("touchstart", saltar, {passive: false}); 
        window.addEventListener("mousedown", saltar);

        function abrirModal(id) { document.getElementById(id).style.display = "flex"; }
        function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = "none"); }
        function cerrarSesion() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
