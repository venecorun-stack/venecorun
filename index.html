<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; touch-action: none; }
        .screen { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #000; z-index: 900; }
        #introScreen { display: flex; background-image: url('portada.png'); cursor: pointer; }
        #loginMenu, #mainMenu { background-image: url('portada.png'); }
        @media (max-aspect-ratio: 1/1) { .screen { background-image: url('portada_mobile.png') !important; background-size: cover !important; } }
        .login-box { background: rgba(0, 0, 0, 0.9); padding: 25px; border: 2px solid #ffcc00; border-radius: 30px; width: 85%; max-width: 320px; box-shadow: 0 0 20px #ffcc00; }
        .btn { padding: 15px; margin: 10px 0; width: 100%; background: #ffcc00; color: #000; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 0 #b38f00; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #000; color: white; }
        #ui { position: absolute; top: 15px; left: 15px; font-size: 24px; z-index: 1000; display: none; text-shadow: 2px 2px #000; }
        canvas { display: none; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ui">PUNTOS: <span id="score">0</span></div>

    <div id="introScreen" class="screen" onclick="clicPortada()">
        <div style="margin-top: 70%; font-size: 20px; animation: pulse 1s infinite;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu" class="screen">
        <div class="login-box">
            <h2 style="color:#ffcc00;">INICIAR SESIÓN</h2>
            <p id="displayTgUser">Cargando...</p>
            <button class="btn" onclick="iniciarConTelegram()">VÍA TELEGRAM</button>
            <button class="btn" style="background:#444; color:#fff;" onclick="verAdvertencia()">MODO INVITADO</button>
        </div>
    </div>

    <div id="warnScreen" class="screen">
        <div class="login-box" style="border-color: #ff4444;">
            <h2 style="color:#ff4444;">¡CUIDADO!</h2>
            <p>Como invitado <b>no recibes Airdrop</b> ni guardas progreso.</p>
            <button class="btn" onclick="entrarInvitado()">ENTRAR IGUAL</button>
            <button class="btn" style="background:#333; color:#fff;" onclick="volverAlLogin()">VOLVER</button>
        </div>
    </div>

    <div id="mainMenu" class="screen">
        <div class="login-box" style="border-color: #00ffff;">
            <h2 id="userNameTitle" style="margin:0;">PLAYER</h2>
            <p id="recordTxt" style="color:#00ffff;">Record: 0</p>
            <button class="btn" style="font-size:24px; background:#00ff00;" onclick="prepararJuego()">¡JUGAR!</button>
            
            <div id="walletSection">
                <input type="text" id="walletInput" placeholder="Wallet BNB BP20" style="display:none;">
                <button id="btnWallet" class="btn" style="background:#f3ba2f; font-size:12px;" onclick="mostrarInputWallet()">VINCULAR WALLET</button>
            </div>
            
            <button class="btn" style="background:transparent; border:1px solid #00ffff; color:#00ffff;" onclick="verRanking()">🏆 RANKING</button>
            <button class="btn" style="background:#0088cc; color:white; font-size:12px;" onclick="compartir()">🔗 INVITAR AMIGOS</button>
        </div>
    </div>

    <div id="gameOverScreen" class="screen" style="background:rgba(0,0,0,0.9);">
        <h1 style="color:red; font-size:45px;">PERDISTE</h1>
        <p style="font-size:24px;">Puntos: <span id="finalScore">0</span></p>
        <button class="btn" onclick="reiniciar()">REINTENTAR</button>
        <button class="btn" style="background:#333; color:#fff;" onclick="volverMenu()">MENÚ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // --- PEGA TU URL DE APPS SCRIPT AQUÍ ---
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwm-7kSo8iV8poCN4fNPiTTQ8xgfMPCNFXsU65n06N2dNnH2k2N964tN_nHsrq8-Ei7gA/exec";

        let userActual = "", esInvitado = false, walletActual = "", recordGlobal = 0;
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // IMÁGENES
        const imgs = {
            c1: new Image(), c2: new Image(), c3: new Image(), c4: new Image(),
            b: new Image(), cielo: new Image(), suelo: new Image()
        };
        imgs.c1.src = 'chiguire.png'; imgs.c2.src = 'chiguire2.png';
        imgs.c3.src = 'chiguire3.png'; imgs.c4.src = 'chiguire4.png';
        imgs.b.src = 'barril.png'; imgs.cielo.src = 'cielo.png'; imgs.suelo.src = 'suelo.png';

        const sndSalto = new Audio('salto.mp3');
        const musFondo = new Audio('musicafondo.mp3'); musFondo.loop = true;

        // NAVEGACIÓN
        function clicPortada() {
            document.getElementById("introScreen").style.display = "none";
            document.getElementById("loginMenu").style.display = "flex";
            userActual = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Usuario";
            document.getElementById("displayTgUser").innerText = "@" + userActual;
        }

        function volverAlLogin() {
            document.getElementById("warnScreen").style.display = "none";
            document.getElementById("loginMenu").style.display = "flex";
        }

        function verAdvertencia() {
            document.getElementById("loginMenu").style.display = "none";
            document.getElementById("warnScreen").style.display = "flex";
        }

        function entrarInvitado() {
            esInvitado = true; userActual = "Invitado"; recordGlobal = 0;
            document.getElementById("warnScreen").style.display = "none";
            mostrarMenu();
        }

        async function iniciarConTelegram() {
            document.getElementById("loginMenu").style.display = "none";
            mostrarMenu();
            const ref = tg.initDataUnsafe?.start_param || "";
            try {
                const res = await fetch(`${URL_SCRIPT}?action=getScore&user=${userActual}&ref=${ref}`);
                const data = await res.json();
                recordGlobal = data.score || 0;
                walletActual = data.wallet || "";
                document.getElementById("recordTxt").innerText = "Record: " + recordGlobal;
                if(walletActual) {
                    document.getElementById("btnWallet").innerText = "WALLET OK ✓";
                    document.getElementById("btnWallet").style.background = "#4CAF50";
                }
            } catch(e) { console.log("Offline"); }
        }

        function mostrarMenu() {
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("userNameTitle").innerText = userActual.toUpperCase();
        }

        function mostrarInputWallet() {
            if(walletActual || esInvitado) return;
            const input = document.getElementById("walletInput");
            if(input.style.display === "none") {
                input.style.display = "block";
                document.getElementById("btnWallet").innerText = "GUARDAR WALLET";
            } else {
                const val = input.value.trim();
                if(/^0x[a-fA-F0-9]{40}$/.test(val)) {
                    walletActual = val;
                    enviarDatos(recordGlobal);
                    alert("¡Wallet vinculada!");
                    mostrarMenu();
                    input.style.display = "none";
                } else { alert("Formato inválido"); }
            }
        }

        // MOTOR DE JUEGO
        let activo = false, score = 0, chig = { x: 50, y: 0, dy: 0, w: 80, h: 80 }, obst = [], vel = 10, frame = 0;

        function prepararJuego() {
            document.getElementById("mainMenu").style.display = "none";
            canvas.style.display = "block"; document.getElementById("ui").style.display = "block";
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            chig.suelo = canvas.height - 180; chig.y = chig.suelo;
            musFondo.play();
            iniciar();
        }

        function iniciar() {
            activo = true; score = 0; obst = []; vel = 10; chig.dy = 0;
            document.getElementById("score").innerText = "0";
            bucle();
            spawn();
        }

        function spawn() {
            if(activo) {
                obst.push({ x: canvas.width + 100, w: 60, h: 75 });
                setTimeout(spawn, 1500 - (vel * 12));
            }
        }

        function bucle() {
            if(!activo) return;
            ctx.clearRect(0,0,canvas.width, canvas.height);

            // Fondos
            if(imgs.cielo.complete) ctx.drawImage(imgs.cielo, 0, 0, canvas.width, canvas.height);
            if(imgs.suelo.complete) ctx.drawImage(imgs.suelo, 0, 0, canvas.width, canvas.height);

            // Chigüire
            chig.dy += 1.4; chig.y += chig.dy;
            if(chig.y > chig.suelo) { chig.y = chig.suelo; chig.dy = 0; }
            
            frame++;
            let anim = (chig.y < chig.suelo - 5) ? imgs.c3 : [imgs.c1, imgs.c2, imgs.c3, imgs.c4][Math.floor(frame/6)%4];
            
            if(anim.complete) ctx.drawImage(anim, chig.x, chig.y, chig.w, chig.h);
            else { ctx.fillStyle = "yellow"; ctx.fillRect(chig.x, chig.y, chig.w, chig.h); }

            // Barriles
            for(let i=obst.length-1; i>=0; i--) {
                obst[i].x -= vel;
                if(imgs.b.complete) ctx.drawImage(imgs.b, obst[i].x, chig.suelo + 15, obst[i].w, obst[i].h);
                else { ctx.fillStyle = "red"; ctx.fillRect(obst[i].x, chig.suelo + 15, obst[i].w, obst[i].h); }

                // Colisión
                if(chig.x < obst[i].x + 40 && chig.x + 50 > obst[i].x && chig.y + 60 > chig.suelo) morir();

                if(obst[i].x < -100) { obst.splice(i,1); score += 10; vel += 0.12; document.getElementById("score").innerText = score; }
            }
            requestAnimationFrame(bucle);
        }

        window.addEventListener("touchstart", (e) => { 
            if(activo && chig.y >= chig.suelo - 5) { chig.dy = -24; sndSalto.play(); } 
        });

        function morir() {
            activo = false; musFondo.pause();
            document.getElementById("gameOverScreen").style.display = "flex";
            document.getElementById("finalScore").innerText = score;
            if(!esInvitado && score > recordGlobal) {
                recordGlobal = score;
                enviarDatos(score);
            }
        }

        function enviarDatos(pts) {
            if(esInvitado) return;
            fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify({usuario: userActual, wallet: walletActual, puntaje: pts}) });
        }

        function reiniciar() { document.getElementById("gameOverScreen").style.display = "none"; musFondo.play(); iniciar(); }
        function volverMenu() { location.reload(); }
        function compartir() { 
            const link = `https://t.me/${BOT_USER}/play?startapp=${userActual}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=¡Juega Veneco Run y gana Airdrop!`); 
        }
        function verRanking() { alert("Próximamente Ranking en vivo..."); }
    </script>
</body>
</html>
