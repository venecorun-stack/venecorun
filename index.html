<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - Airdrop Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; }
        #logoutBtn { position: absolute; top: 15px; right: 15px; z-index: 1000; background: #ff4444; color: white; border: 2px solid white; padding: 10px 15px; border-radius: 12px; cursor: pointer; font-weight: bold; display: none; }
        
        #introScreen, #loginMenu, #gameOverScreen { 
            position: absolute; width: 100%; height: 100%; 
            background-color: #000; background-position: center; 
            background-repeat: no-repeat; background-size: contain;
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; z-index: 900; text-align: center; 
        }

        #introScreen { background-image: url('portada.png'); cursor: pointer; justify-content: flex-end; }

        @media (max-aspect-ratio: 1/1) {
            #introScreen { background-image: url('portada_mobile.png') !important; background-size: cover !important; }
        }

        #loginMenu { background-image: url('portada.png'); display: none; }
        #gameOverScreen { background: rgba(0,0,0,0.95); display: none; }
        
        .login-box { background: rgba(0,0,0,0.9); padding: 30px; border: 3px solid #ffcc00; border-radius: 20px; width: 85%; max-width: 350px; }
        .btn { padding: 15px 35px; font-size: 18px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0px 5px 0px #b38f00; margin-top: 10px; width: 100%; }
        .btn-tg { background: #24A1DE; color: white; box-shadow: 0px 5px 0px #1a719b; margin-top: 20px; }
        
        .share-btn { background: #000; color: white; border: 2px solid #555; padding: 12px 25px; border-radius: 50px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        
        #ui { position: absolute; top: 20px; left: 20px; z-index: 850; display: none; pointer-events: none; }
        .score-text { font-size: 40px; color: white; text-shadow: 3px 3px 0 #000; margin: 0; }
        .record-ui { color: #ffcc00; font-size: 20px; text-shadow: 2px 2px 0 #000; margin: 0; }
        
        #levelContainer { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); z-index: 800; text-align: center; width: 100%; display: none; pointer-events: none; }
        #levelText { font-size: 55px; color: #ffcc00; font-weight: bold; text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; margin: 0; opacity: 0.8; }
        canvas { display: none; image-rendering: -webkit-optimize-contrast; }
    </style>
</head>
<body>

    <button id="logoutBtn" onclick="cerrarSesion()">CERRAR SESIÓN ✖</button>

    <div id="introScreen" onclick="clicPortada()">
        <div style="font-size:24px; color:white; margin-bottom:80px; text-shadow: 0 0 15px #ffcc00; background: rgba(0,0,0,0.5); width:100%;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu">
        <div class="login-box">
            <h2 style="color:#ffcc00; margin-top:0;">REGISTRO AIRDROP</h2>
            <p style="color:white; font-size:14px;">Inicia sesión con tu Telegram oficial para registrar tus puntos.</p>
            <button class="btn btn-tg" onclick="guardarYEntrarTelegram()">INICIAR CON TELEGRAM</button>
        </div>
    </div>

    <div id="ui">
        <div id="displayUser" style="color:#00ffff; font-size:22px; text-shadow: 2px 2px 0 #000;"></div>
        <p class="score-text">PUNTOS: <span id="score">0</span></p>
        <p class="record-ui">RECORD: <span id="highScoreText">0</span></p>
    </div>

    <div id="levelContainer">
        <p id="levelText">PRINCIPIANTE</p>
    </div>

    <div id="gameOverScreen">
        <h1 style="color:#ff4444; font-size:45px; text-shadow: 3px 3px 0 #000;">¡FIN DEL JUEGO!</h1>
        <div style="display:flex; align-items:center; gap:20px; justify-content:center; margin-bottom:15px;">
            <div>
                <p style="font-size:28px; margin:0;">Puntos: <span id="finalScore">0</span></p>
                <p style="font-size:20px; color:#ffcc00; margin:0;">Récord: <span id="finalBest">0</span></p>
            </div>
            <img src="derrota.png" style="width:120px; border-radius:15px;">
        </div>
        <button class="share-btn" onclick="compartirX()">𝕏 Compartir en Twitter</button>
        <button class="btn" onclick="location.reload()">REINTENTAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const imgC = new Image(); imgC.src = 'chiguire.png';
        const imgD = new Image(); imgD.src = 'derrota.png';
        const imgB = new Image(); imgB.src = 'barril.png';
        const imgF = new Image(); imgF.src = 'fondo.png';

        const sndClick = new Audio('click.mp3');
        const sndSalto = new Audio('salto.mp3');
        const sndPerder = new Audio('perder.mp3');
        const musFondo = new Audio('musicafondo.mp3'); musFondo.loop = true;
        const sndIntro = new Audio('intro.mp3'); sndIntro.loop = true;

        let activo = false, score = 0, vel = 11, obst = [], bgX = 0;
        let recordGlobal = localStorage.getItem('venecoRunHighScore') || 0;
        let chig = { x: 80, y: 0, w: 110, h: 110, dy: 0, g: 2.1, salto: -23, suelo: 0, vivo: true };
        let estela = [];
        let nivelActual = "";

        if(localStorage.getItem('venecoUser')) document.getElementById("logoutBtn").style.display = "block";

        function cerrarSesion() { localStorage.clear(); location.reload(); }

        function clicPortada() { 
            sndClick.play(); sndIntro.play(); 
            document.getElementById("introScreen").style.display = "none"; 
            if(localStorage.getItem('venecoUser')) {
                prepararJuego(); 
            } else {
                document.getElementById("loginMenu").style.display = "flex"; 
            }
        }

        function guardarYEntrarTelegram() {
            sndClick.play();
            let userReal = "Invitado";
            let tgID = "000000";

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                userReal = u.username ? "@" + u.username : u.first_name;
                tgID = u.id.toString();
            } else {
                userReal = "Tester_" + Math.floor(Math.random()*99);
            }

            localStorage.setItem('venecoUser', userReal);
            localStorage.setItem('venecoTGID', tgID);
            
            document.getElementById("loginMenu").style.display = "none";
            prepararJuego();
        }

        function prepararJuego() { 
            sndIntro.pause(); musFondo.play(); 
            canvas.style.display = "block"; 
            document.getElementById("ui").style.display = "block"; 
            document.getElementById("levelContainer").style.display = "block";
            document.getElementById("displayUser").innerText = localStorage.getItem('venecoUser');
            document.getElementById("highScoreText").innerText = recordGlobal;
            ajustar(); iniciar(); 
        }

        function ajustar() { 
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr); 
            chig.suelo = window.innerHeight - 220; chig.y = chig.suelo;
            chig.x = (window.innerWidth < 600) ? 25 : 100;
        }

        function iniciar() { activo = true; chig.vivo = true; score = 0; vel = 11; obst = []; estela = []; bucle(); spawn(); }

        async function enviarDatosExcel(puntos) {
            const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwUqRVs7tK0qi_1bRx7JARIo5EZ6cUg3TAcVADA4LxfX2rqCnbFkaKLtYaupECRW36T/exec";
            const datos = { 
                usuario: localStorage.getItem('venecoUser'), 
                wallet: localStorage.getItem('venecoTGID'), 
                puntaje: puntos 
            };
            try { fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) }); } catch (e) {}
        }

        function morir() { 
            activo = false; chig.vivo = false; musFondo.pause(); sndPerder.play(); 
            if(score > recordGlobal) { recordGlobal = score; localStorage.setItem('venecoRunHighScore', recordGlobal); }
            enviarDatosExcel(score);
            document.getElementById("finalScore").innerText = score; 
            document.getElementById("finalBest").innerText = recordGlobal;
            document.getElementById("gameOverScreen").style.display = "flex"; 
        }

        function compartirX() {
            const msg = `🏆 ¡He conseguido ${score} puntos en Veneco Run! 🚀 Récord: ${recordGlobal}. #VenecoRun #Airdrop`;
            window.open(`https://twitter.com/intent/tweet?text=${msg}`, '_blank');
        }

        const saltar = () => { if(activo && chig.y >= chig.suelo - 10) { chig.dy = chig.salto; sndSalto.currentTime = 0; sndSalto.play(); } };
        window.addEventListener("mousedown", saltar);
        window.addEventListener("touchstart", saltar);
        window.addEventListener("keydown", (e) => { if(e.code === "Space") { e.preventDefault(); saltar(); } });
        window.onresize = ajustar;

        function spawn() {
            if(!activo) return;
            let esDoble = score >= 200 && Math.random() > 0.6;
            obst.push({ x: window.innerWidth + 150, w: esDoble ? 125 : 80, h: 90, doble: esDoble });
            setTimeout(spawn, Math.max(700, 1100 / (vel * 0.07)));
        }

        function bucle() {
            if(!activo && !chig.vivo) return;
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            bgX -= vel * 0.4; if(bgX <= -window.innerWidth) bgX = 0;
            ctx.drawImage(imgF, bgX, 0, window.innerWidth, window.innerHeight);
            ctx.drawImage(imgF, bgX + window.innerWidth - 1, 0, window.innerWidth, window.innerHeight);

            if(activo) {
                chig.dy += chig.g; chig.y += chig.dy;
                if(chig.y > chig.suelo) { chig.y = chig.suelo; chig.dy = 0; }
                for(let i = obst.length - 1; i >= 0; i--) {
                    obst[i].x -= vel;
                    ctx.drawImage(imgB, obst[i].x, chig.suelo + (chig.h - obst[i].h), obst[i].w, obst[i].h);
                    if (chig.x + 35 < obst[i].x + obst[i].w - 35 && chig.x + chig.w - 35 > obst[i].x + 35 && chig.y + 35 < chig.suelo + 90 && chig.y + chig.h - 15 > chig.suelo + (chig.h - obst[i].h)) morir();
                    if(obst[i].x < -200) { obst.splice(i, 1); score += 10; document.getElementById("score").innerText = score; vel += 0.15; }
                }
            }
            ctx.drawImage(chig.vivo ? imgC : imgD, chig.x, chig.y, chig.w, chig.h);
            requestAnimationFrame(bucle);
        }
    </script>
</body>
</html>
