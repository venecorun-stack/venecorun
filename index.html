<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - Master Edition</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; touch-action: none; }
        
        #introScreen, #loginMenu, #mainMenu, #gameOverScreen, #rankingModal { 
            position: absolute; width: 100%; height: 100%; background-color: #000;
            background-position: center; background-repeat: no-repeat; background-size: contain;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 900; text-align: center; 
        }

        #introScreen { background-image: url('portada.png'); cursor: pointer; justify-content: flex-end; }
        #loginMenu, #mainMenu { background-image: url('portada.png'); display: none; }
        
        @media (max-aspect-ratio: 1/1) {
            #introScreen, #loginMenu, #mainMenu { background-image: url('portada_mobile.png') !important; background-size: cover !important; }
        }

        #gameOverScreen { background: rgba(0,0,0,0.95); display: none; }
        #rankingModal { background: rgba(0,0,0,0.98); display: none; z-index: 1001; }

        .login-box { background: rgba(10, 10, 10, 0.95); padding: 25px; border: 1px solid #ffcc00; border-radius: 30px; width: 85%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #333; font-size: 14px; background: #000; color: white; outline: none; }
        
        .btn-play-neon { 
            width: 115px; height: 115px; border-radius: 50%; background: #ffcc00; color: #000; 
            font-size: 20px; font-weight: 900; border: none; cursor: pointer; 
            box-shadow: 0 0 15px #ffcc00, 0 0 30px #ffcc00; margin: 15px 0; 
            display: flex; align-items: center; justify-content: center; 
            text-transform: uppercase; animation: pulse-neon 1.5s infinite;
        }
        @keyframes pulse-neon {
            0% { box-shadow: 0 0 15px #ffcc00; transform: scale(1); }
            50% { box-shadow: 0 0 40px #ffcc00; transform: scale(1.05); }
            100% { box-shadow: 0 0 15px #ffcc00; transform: scale(1); }
        }

        .btn { padding: 12px 25px; font-size: 16px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; margin-top: 10px; width: 100%; box-shadow: 0px 4px 0px #b38f00; }
        .btn-ranking { background: transparent; border: 2px solid #00ffff; color: #00ffff; box-shadow: none; margin-bottom: 5px; }
        .btn-menu { background: rgba(255,255,255,0.1); color: white; font-size: 14px; border: 1px solid rgba(255,255,255,0.2); }
        .btn-logout { background: transparent; color: #ff4444; border: 1px solid #ff4444; font-size: 12px; margin-top: 20px; box-shadow: none; }

        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 20px; }
        .social-item { 
            display: flex; align-items: center; justify-content: center; gap: 5px;
            padding: 12px; border-radius: 15px; font-size: 13px; font-weight: bold;
            text-decoration: none; color: white; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }

        #ui { position: absolute; top: 10px; left: 10px; z-index: 850; display: none; pointer-events: none; }
        .score-text { font-size: 22px; color: white; text-shadow: 2px 2px 0 #000; margin: 0; }
        #levelContainer { position: absolute; top: 10px; right: 10px; z-index: 800; display: none; }
        #levelText { font-size: 18px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 5px; }

        canvas { display: none; image-rendering: -webkit-optimize-contrast; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="introScreen" onclick="clicPortada()">
        <div style="font-size:24px; color:white; margin-bottom:80px; text-shadow: 0 0 15px #ffcc00; background: rgba(0,0,0,0.5); width:100%;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu">
        <div class="login-box">
            <h2 style="color:#ffcc00; margin-top:0;">REGISTRO AIRDROP</h2>
            <input type="text" id="tgUser" placeholder="Usuario">
            <input type="text" id="bnbWallet" placeholder="Wallet BNB BEP20 (Metamask)">
            <button class="btn" onclick="guardarYEntrar()">REGISTRARSE</button>
        </div>
    </div>

    <div id="mainMenu">
        <div class="login-box" style="border-color: #00ffff;">
            <p style="color:#aaa; font-size: 11px; margin: 0;">PLAYER PROFILE</p>
            <h2 id="userNameTitle" style="color:#fff; margin: 5px 0 10px 0; font-size: 26px;">USUARIO</h2>
            <div style="display: flex; justify-content: center;">
                <button class="btn-play-neon" onclick="prepararJuego()">JUGAR</button>
            </div>
            <p id="menuBestScore" style="margin: 0 0 15px 0; color: #00ffff; font-size: 14px;">Record: 0 pts</p>
            <button class="btn btn-ranking" onclick="verRanking()">🏆 RANKING GLOBAL</button>

            <div class="social-grid">
                <a href="https://t.me/venecoinu" target="_blank" class="social-item" style="border-bottom: 2px solid #0088cc;">Telegram</a>
                <a href="https://x.com/veneco_toke" target="_blank" class="social-item" style="border-bottom: 2px solid #fff;">Twitter</a>
                <a href="https://www.tiktok.com/@venecotoken" target="_blank" class="social-item" style="border-bottom: 2px solid #ff0050;">TikTok</a>
                <a href="https://veneco.lol/" target="_blank" class="social-item" style="border-bottom: 2px solid #ffcc00;">Website</a>
            </div>

            <button class="btn btn-logout" onclick="cerrarSesion()">CERRAR SESIÓN ✖</button>
        </div>
    </div>

    <div id="rankingModal">
        <div class="ranking-content">
            <h2 style="color:#ffcc00; margin-top:0;">TOP 10 PLAYERS</h2>
            <div id="loadingRanking">Cargando...</div>
            <table id="rankingTable">
                <thead><tr><th>#</th><th>Usuario</th><th>Puntos</th></tr></thead>
                <tbody id="rankingBody"></tbody>
            </table>
            <button class="btn" style="margin-top:20px;" onclick="cerrarRanking()">VOLVER</button>
        </div>
    </div>

    <div id="ui">
        <p class="score-text">PUNTOS: <span id="score">0</span></p>
        <p style="color: #ffcc00; font-size: 14px; margin:0;">RECORD: <span id="highScoreText">0</span></p>
    </div>
    <div id="levelContainer"><p id="levelText">PRINCIPIANTE</p></div>

    <div id="gameOverScreen">
        <h1 style="color:#ff4444; font-size:35px; text-shadow: 3px 3px 0 #000;">¡FIN DEL JUEGO!</h1>
        <div class="login-box" style="margin-bottom: 20px;">
            <div style="display:flex; align-items:center; gap:20px; justify-content:center;">
                <div>
                    <p style="font-size:24px; margin:0;">Puntos: <span id="finalScore">0</span></p>
                    <p style="font-size:18px; color:#ffcc00; margin:0;">Récord: <span id="finalBest">0</span></p>
                </div>
                <img src="derrota.png" style="width:80px; border-radius:15px;">
            </div>
        </div>
        <button class="btn" onclick="reiniciarRapido()">REINTENTAR</button>
        <button class="btn btn-menu" onclick="volverAlMenu()">VOLVER AL MENÚ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyb83SGQoXgHh_eWtJzEr39FmnnoiM__y7fH_GEytH5uAqVCczOUufe523OnXhRcSYzYw/exec";

        const imgC1 = new Image(); imgC1.src = 'chiguire.png';
        const imgC2 = new Image(); imgC2.src = 'chiguire2.png';
        const imgC3 = new Image(); imgC3.src = 'chiguire3.png';
        const imgC4 = new Image(); imgC4.src = 'chiguire4.png';
        const imgD = new Image(); imgD.src = 'derrota.png';
        const imgB = new Image(); imgB.src = 'barril.png';
        const imgF = new Image(); imgF.src = 'fondo.png';

        const sndClick = new Audio('click.mp3');
        const sndSalto = new Audio('salto.mp3');
        const sndPerder = new Audio('perder.mp3');
        const musFondo = new Audio('musicafondo.mp3'); musFondo.loop = true;
        const sndIntro = new Audio('intro.mp3'); sndIntro.loop = true;

        let activo = false, score = 0, vel = 11, obst = [], bgX = 0, frameAnim = 0;
        let recordGlobal = localStorage.getItem('venecoRunHighScore') || 0;
        let chig = { x: 80, y: 0, w: 110, h: 110, dy: 0, g: 2.1, salto: -23, suelo: 0, vivo: true };
        let estela = [], nivelActual = "";
        let ultimoTiempo = 0;
        const fpsObjetivo = 1000 / 60; 

        function cerrarSesion() { localStorage.clear(); location.reload(); }

        function clicPortada() { 
            sndClick.play(); sndIntro.play(); 
            document.getElementById("introScreen").style.display = "none"; 
            if(localStorage.getItem('venecoUser')) mostrarMenuPrincipal(); 
            else document.getElementById("loginMenu").style.display = "flex"; 
        }

        function guardarYEntrar() {
            const u = document.getElementById("tgUser").value;
            const w = document.getElementById("bnbWallet").value;
            if(u.length > 2) {
                localStorage.setItem('venecoUser', u);
                localStorage.setItem('venecoWallet', w);
                document.getElementById("loginMenu").style.display = "none";
                mostrarMenuPrincipal();
            }
        }

        function mostrarMenuPrincipal() {
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("userNameTitle").innerText = localStorage.getItem('venecoUser').toUpperCase();
            document.getElementById("menuBestScore").innerText = "Record: " + (localStorage.getItem('venecoRunHighScore') || 0);
        }

        function prepararJuego() { 
            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("ui").style.display = "block"; 
            document.getElementById("levelContainer").style.display = "block";
            canvas.style.display = "block"; 
            ajustar(); 
            sndIntro.pause(); 
            musFondo.currentTime = 0;
            musFondo.play().catch(e => console.log("Audio waiting..."));
            document.getElementById("highScoreText").innerText = recordGlobal;
            iniciar(); 
        }

        function ajustar() { 
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width = w * dpr; 
            canvas.height = h * dpr;
            canvas.style.width = w + 'px'; 
            canvas.style.height = h + 'px';
            ctx.scale(dpr, dpr); 
            chig.suelo = h - 220; 
            chig.y = chig.suelo;
            chig.x = w < 600 ? 30 : 100;
        }

        function iniciar() { 
            activo = true; chig.vivo = true; score = 0; vel = 11; obst = []; estela = []; frameAnim = 0;
            ultimoTiempo = performance.now();
            requestAnimationFrame(bucle); 
            setTimeout(spawn, 2000); 
        }

        async function enviarDatosExcel(puntos) {
            const datos = { usuario: localStorage.getItem('venecoUser'), wallet: localStorage.getItem('venecoWallet'), puntaje: puntos };
            try { fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) }); } catch (e) {}
        }

        function morir() { 
            activo = false; chig.vivo = false; musFondo.pause(); sndPerder.play(); 
            if(score > recordGlobal) { recordGlobal = score; localStorage.setItem('venecoRunHighScore', recordGlobal); }
            enviarDatosExcel(score);
            document.getElementById("finalScore").innerText = score; 
            document.getElementById("finalBest").innerText = recordGlobal;
            document.getElementById("gameOverScreen").style.display = "flex"; 
        }

        function reiniciarRapido() {
            document.getElementById("gameOverScreen").style.display = "none";
            musFondo.currentTime = 0; musFondo.play(); iniciar();
        }

        function volverAlMenu() {
            document.getElementById("gameOverScreen").style.display = "none";
            canvas.style.display = "none";
            document.getElementById("ui").style.display = "none";
            document.getElementById("levelContainer").style.display = "none";
            mostrarMenuPrincipal();
        }

        const saltar = () => { if(activo && chig.y >= chig.suelo - 10) { chig.dy = chig.salto; sndSalto.currentTime = 0; sndSalto.play(); } };
        window.addEventListener("mousedown", saltar);
        window.addEventListener("touchstart", (e) => { 
            if(activo) { e.preventDefault(); saltar(); }
        }, {passive: false});
        window.addEventListener("keydown", (e) => { if(e.code === "Space") { e.preventDefault(); saltar(); } });
        window.onresize = ajustar;

        function spawn() {
            if(!activo) return;
            let esDoble = score >= 200 && Math.random() > 0.6;
            obst.push({ x: window.innerWidth + 150, w: esDoble ? 125 : 80, h: 90, doble: esDoble });
            let baseFreq = 1100 / (vel * 0.07);
            if (score > 800) baseFreq *= (0.7 + Math.random() * 0.5);
            let delay = Math.max(baseFreq, esDoble ? 1100 : 700); 
            setTimeout(spawn, delay);
        }

        function bucle(tiempoActual) {
            if(!activo && !chig.vivo) return;
            const delta = tiempoActual - ultimoTiempo;
            if (delta >= fpsObjetivo) {
                ultimoTiempo = tiempoActual - (delta % fpsObjetivo);
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                bgX -= vel * 0.4; if(bgX <= -window.innerWidth) bgX = 0;
                ctx.drawImage(imgF, bgX, 0, window.innerWidth + 1, window.innerHeight);
                ctx.drawImage(imgF, bgX + window.innerWidth, 0, window.innerWidth + 1, window.innerHeight);

                if(activo) {
                    chig.dy += chig.g; chig.y += chig.dy;
                    if(chig.y > chig.suelo) { chig.y = chig.suelo; chig.dy = 0; }
                    if(score >= 1000) {
                        estela.push({x: chig.x, y: chig.y, o: 0.4});
                        if(estela.length > 5) estela.shift();
                    }

                    frameAnim++;
                    let imgActual = (chig.y < chig.suelo - 10) ? imgC3 : [imgC1, imgC2, imgC3, imgC4][Math.floor(frameAnim / 6) % 4];

                    estela.forEach((p, i) => {
                        ctx.globalAlpha = p.o * (i / estela.length);
                        ctx.drawImage(imgActual, p.x - (estela.length - i) * 10, p.y, chig.w, chig.h);
                        ctx.globalAlpha = 1;
                    });

                    let nuevoLvl = "PRINCIPIANTE";
                    if(score >= 2000) nuevoLvl = "NIVEL CAOS";
                    else if(score >= 1000) nuevoLvl = "NIVEL AREPA";
                    else if(score >= 500) nuevoLvl = "NIVEL MANGO";
                    else if(score >= 200) nuevoLvl = "NIVEL GUACAMAYA";
                    if (nuevoLvl !== nivelActual) { nivelActual = nuevoLvl; document.getElementById("levelText").innerText = nivelActual; }

                    if(score >= 2000) vel += 0.005;
                    else if(score >= 1000) vel += 0.004;
                    else if(score >= 500) vel += 0.003;
                    else if(score >= 200) vel += 0.002;

                    for(let i = obst.length - 1; i >= 0; i--) {
                        obst[i].x -= vel;
                        let bY = chig.suelo + (chig.h - obst[i].h);
                        if(obst[i].doble) {
                            ctx.drawImage(imgB, obst[i].x, bY, 80, obst[i].h);
                            ctx.drawImage(imgB, (obst[i].x + 80) - 35, bY, 80, obst[i].h);
                        } else { ctx.drawImage(imgB, obst[i].x, bY, obst[i].w, obst[i].h); }
                        
                        if (chig.x + 35 < obst[i].x + obst[i].w - 35 && chig.x + chig.w - 35 > obst[i].x + 35 && chig.y + 35 < bY + obst[i].h && chig.y + chig.h - 15 > bY) morir();
                        if(obst[i].x < -200) { obst.splice(i, 1); score += 10; document.getElementById("score").innerText = score; vel += 0.15; }
                    }
                    ctx.drawImage(imgActual, chig.x, chig.y, chig.w, chig.h);
                } else { ctx.drawImage(imgD, chig.x, chig.y, chig.w, chig.h); }
            }
            requestAnimationFrame(bucle);
        }

        async function verRanking() {
            document.getElementById("rankingModal").style.display = "flex";
            document.getElementById("rankingBody").innerHTML = "";
            document.getElementById("loadingRanking").style.display = "block";
            try {
                const response = await fetch("https://script.google.com/macros/s/AKfycbzzOjoOCd5HwIdC6_1ZhzT_VheVHiORDF0mkIf_Zp6R9ajIrAP8xT3_U6Ah8aAPcYkHfA/exec?action=getRanking");
                const data = await response.json();
                document.getElementById("loadingRanking").style.display = "none";
                data.forEach((p, i) => { 
                    document.getElementById("rankingBody").innerHTML += `<tr><td>${i+1}</td><td>${p.usuario}</td><td>${p.puntaje}</td></tr>`; 
                });
            } catch (e) { document.getElementById("loadingRanking").innerText = "Error al cargar."; }
        }
        function cerrarRanking() { document.getElementById("rankingModal").style.display = "none"; }
    </script>
</body>
</html>
