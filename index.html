<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Veneco Run</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial Black}
#logoutBtn{position:absolute;top:15px;right:15px;z-index:2000;background:#ff4444;color:#fff;border:2px solid #fff;padding:10px;border-radius:10px;display:none}
#introScreen,#loginMenu,#mainMenu,#gameOverScreen{position:absolute;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#introScreen{background:url('portada_mobile.png') center/cover;cursor:pointer}
#loginMenu{display:none}
#mainMenu{display:none;background:#000;padding-top:30px}
.menu-opt{width:85%;max-width:320px;padding:14px;margin:6px;background:rgba(255,255,255,.08);border-radius:18px;cursor:pointer}
.play-circle{width:110px;height:110px;background:#2ecc71;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:3000;align-items:center;justify-content:center}
.modal-content{background:#111;padding:25px;border-radius:20px;width:85%}
.btn{padding:15px;background:#ffcc00;border-radius:50px;border:none;font-weight:bold;width:100%;margin-top:10px}
canvas{display:none}
</style>
</head>

<body>

<button id="logoutBtn" onclick="cerrarSesion()">SALIR ✖</button>

<div id="introScreen" onclick="clicPortada()">
  <div style="background:rgba(0,0,0,.7);padding:20px">TOCA PARA INICIAR</div>
</div>

<div id="loginMenu">
  <button class="btn" onclick="loginTG()">ENTRAR CON TELEGRAM</button>
</div>

<div id="mainMenu">
  <div id="userProfile">
    <div id="userNameDisplay"></div>
    <div>PUNTOS: <span id="currentScoreMenu">0</span></div>
  </div>

  <div class="play-circle" onclick="prepararJuego()">JUGAR</div>

  <div class="menu-opt" onclick="abrirModal('modalRef')">👥 MIS REFERIDOS (+150)</div>
  <div class="menu-opt" onclick="abrirModal('modalRank')">🏆 RANKING</div>
  <div class="menu-opt" onclick="abrirModal('modalAirdrop')">💰 REGISTRAR WALLET</div>
  <div class="menu-opt" id="btnTGTask" onclick="unirseTelegramTask()">📢 CANAL TELEGRAM (+1000)</div>
</div>

<div id="modalRef" class="modal">
  <div class="modal-content">
    <h3>REFERIDOS</h3>
    <input id="refLink" readonly>
    <button class="btn" onclick="copiarRef()">COPIAR</button>
    <button class="btn" onclick="cerrarModales()">CERRAR</button>
  </div>
</div>

<div id="modalRank" class="modal">
  <div class="modal-content">
    <h3>TOP 10</h3>
    <div id="rankList">Cargando...</div>
    <button class="btn" onclick="cerrarModales()">CERRAR</button>
  </div>
</div>

<div id="modalAirdrop" class="modal">
  <div class="modal-content">
    <input id="walletInput" placeholder="0x...">
    <button class="btn" onclick="guardarWallet()">GUARDAR</button>
    <button class="btn" onclick="cerrarModales()">CERRAR</button>
  </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxS64u2ud1QZ2G93d0sQpD7T2iXemvRwVvBXcVw9dvgIjpAZROBsdqnjY1OPPAopSAh/exec";
const referidoPor = tg.initDataUnsafe.start_param || null;

async function postData(body){
  try{
    await fetch(URL_SCRIPT,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(body)
    });
  }catch(e){}
}

function clicPortada(){
  introScreen.style.display="none";
  localStorage.getItem("venecoUser") ? mostrarMenu() : loginMenu.style.display="flex";
}

function loginTG(){
  const u = tg.initDataUnsafe.user;
  const user = u.username ? "@"+u.username : u.first_name;
  const id = u.id.toString();
  const nuevo = !localStorage.getItem("venecoUser");

  localStorage.setItem("venecoUser",user);
  localStorage.setItem("venecoTGID",id);

  postData({accion:"registro",usuario:user,wallet:id});

  if(referidoPor && nuevo && referidoPor!==id){
    postData({accion:"sumar_referido",referidoPor:referidoPor,nuevo:id});
  }

  mostrarMenu();
}

async function mostrarMenu(){
  loginMenu.style.display="none";
  mainMenu.style.display="flex";
  logoutBtn.style.display="block";

  userNameDisplay.innerText = localStorage.getItem("venecoUser");
  refLink.value = "https://t.me/venecotoken_bot/venecorun?startapp="+localStorage.getItem("venecoTGID");

  try{
    const r = await fetch(URL_SCRIPT+"?tipo=getUserData&id="+localStorage.getItem("venecoTGID"));
    const d = await r.json();
    currentScoreMenu.innerText = d.puntos || 0;
    if(d.bono) marcarTareaCompletada();
  }catch(e){}
}

async function unirseTelegramTask(){
  if(localStorage.getItem("taskTGDone")) return alert("Ya completado ✅");
  window.open("https://t.me/venecoinu","_blank");

  await postData({
    accion:"bono_tg",
    usuario:localStorage.getItem("venecoUser"),
    wallet:localStorage.getItem("venecoTGID")
  });

  localStorage.setItem("taskTGDone","true");
  marcarTareaCompletada();
  alert("+1000 puntos 🎉");
  setTimeout(mostrarMenu,1500);
}

function marcarTareaCompletada(){
  btnTGTask.style.opacity="0.5";
  btnTGTask.onclick=null;
  btnTGTask.innerHTML="✅ TAREA COMPLETADA";
}

function guardarWallet(){
  postData({
    accion:"guardar_wallet",
    usuario:localStorage.getItem("venecoUser"),
    wallet:localStorage.getItem("venecoTGID"),
    walletAddress:walletInput.value
  });
  alert("Wallet guardada");
  cerrarModales();
}

function abrirModal(id){document.getElementById(id).style.display="flex"}
function cerrarModales(){document.querySelectorAll(".modal").forEach(m=>m.style.display="none")}
function cerrarSesion(){localStorage.clear();location.reload()}
function copiarRef(){refLink.select();document.execCommand("copy");alert("Copiado")}
</script>

</body>
</html>
