<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    const tg = window.Telegram.WebApp;

    async function autenticarYEntrar() {
        let u, w;
        
        // Prioridad 1: Telegram Automático
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            u = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
            w = "TG_" + (tg.initDataUnsafe.user.id); // Usamos ID de Telegram como Wallet interna
        } else {
            // Prioridad 2: Manual (Formulario)
            u = document.getElementById("tgUser").value.trim();
            w = document.getElementById("bnbWallet").value.trim();
            if(u.length < 3 || !/^0x[a-fA-F0-9]{40}$/.test(w)) { alert("Datos inválidos"); return; }
        }

        document.getElementById("loadingLogin").style.display = "block";
        try {
            // Enviamos AMBOS parámetros para que el script no se confunda
            const response = await fetch(`${URL_SCRIPT}?action=getScore&wallet=${w}&user=${u}`);
            const data = await response.json();
            
            localStorage.setItem('venecoUser', u); 
            localStorage.setItem('venecoWallet', w);
            recordGlobal = data.score || 0; 
            localStorage.setItem('venecoRunHighScore', recordGlobal);
            
            document.getElementById("loginMenu").style.display = "none"; 
            mostrarMenuPrincipal();
        } catch (e) { 
            console.error(e);
            alert("Error de conexión. Verifica que el Script esté publicado como 'Cualquiera'."); 
        }
        document.getElementById("loadingLogin").style.display = "none";
    }

    // Al cargar la página, si es Telegram, el botón cambia de texto
    window.onload = () => {
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const btn = document.querySelector(".btn[onclick='autenticarYEntrar()']");
            btn.innerText = "ENTRAR CON TELEGRAM";
            document.getElementById("tgUser").style.display = "none";
            document.getElementById("bnbWallet").style.display = "none";
        }
    };
</script>
