<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - Fase 5 Master V3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; }
        #logoutBtn { position: absolute; top: 15px; right: 15px; z-index: 2000; background: #ff4444; color: white; border: 2px solid white; padding: 10px; border-radius: 10px; cursor: pointer; display: none; font-weight: bold; }
        
        #introScreen, #loginMenu, #mainMenu, #gameOverScreen { 
            position: absolute; width: 100%; height: 100%; background-position: center; background-repeat: no-repeat; background-size: cover; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; 
        }
        #introScreen { background-image: url('portada_mobile.png'); cursor: pointer; justify-content: flex-end; }
        #loginMenu { background-image: url('portada_mobile.png'); display: none; }
        #mainMenu { background: radial-gradient(circle, #1a1a1a, #000); display: none; overflow-y: auto; padding: 20px 0; }
        #gameOverScreen { background: rgba(0,0,0,0.95); display: none; }

        #ui { position: absolute; top: 15px; left: 15px; z-index: 850; display: none; pointer-events: none; text-align: left; }
        #scoreDisplay { font-size: 22px; color: white; text-shadow: 2px 2px 0 #000; margin: 0; }
        #bestDisplay { font-size: 14px; color: #ffcc00; text-shadow: 1px 1px 0 #000; margin: 0; }
        
        #levelContainer { position: absolute; top: 15px; right: 15px; z-index: 800; text-align: right; display: none; pointer-events: none; }
        #levelText { font-size: 18px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 0 #000; margin: 0; }
        
        canvas { display: none; image-rendering: -webkit-optimize-contrast; cursor: pointer; }
        .btn { padding: 15px; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 16px; }
    </style>
</head>
<body>

    <button id="logoutBtn" onclick="cerrarSesion()">SALIR ✖</button>

    <div id="introScreen" onclick="clicPortada()">
        <div style="background:rgba(0,0,0,0.7); width:100%; padding:20px; margin-bottom:50px;">TOCA PARA INICIAR</div>
    </div>

    <div id="loginMenu">
        <div style="background:rgba(0,0,0,0.85); padding:30px; border-radius:25px; border:2px solid #ffcc00; width: 80%;">
            <h2 style="color:#ffcc00;">REGISTRO</h2>
            <div id="loginContainer"></div>
        </div>
    </div>

    <div id="mainMenu">
        <div id="userProfile" style="background: rgba(255, 204, 0, 0.15); border: 1px solid #ffcc00; padding: 12px 25px; border-radius: 20px; margin-bottom: 20px;">
            <span id="userNameDisplay" style="color:#ffcc00;">Cargando...</span>
            <div style="font-size: 22px; font-weight: bold;">PUNTOS: <span id="currentScoreMenu">...</span></div>
        </div>
        <div style="width:120px; height:120px; background:#2ecc71; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; border:4px solid white; margin-bottom:20px;" onclick="prepararJuego()">JUGAR</div>
        <div style="font-size:12px; color:#aaa;">Tus puntos se sincronizan con el Excel</div>
    </div>

    <div id="ui">
        <p id="scoreDisplay">SCORE: <span id="score">0</span></p>
        <p id="bestDisplay">BEST: <span id="highScoreText">0</span></p>
    </div>

    <div id="levelContainer">
        <p id="levelText">PRINCIPIANTE</p>
    </div>

    <div id="gameOverScreen">
        <h1 style="color:#ff4444; font-size:40px;">¡FIN DEL JUEGO!</h1>
        <p style="font-size:25px;">Puntaje: <span id="finalScore">0</span></p>
        <button class="btn" onclick="location.reload()">VOLVER AL MENÚ</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzwBSVNdugeDYOuu0VamA-YCmTh-jOg8QeiIGaM5jO0BRKn_OpYameJDMiCO8IGsBEE/exec";

        const imgC = new Image(); imgC.src = 'chiguire.png';
        const imgB = new Image(); imgB.src = 'barril.png';
        const imgF = new Image(); imgF.src = 'fondo.png';
        const imgD = new Image(); imgD.src = 'derrota.png';
        const sndSalto = new Audio('salto.mp3');

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let activo = false, score = 0, vel = 11, obst = [], bgX = 0;
        let recordLocal = localStorage.getItem('venecoRunBest') || 0;
        let chig = { x: 80, y: 0, w: 100, h: 100, dy: 0, g: 2.1, salto: -23, suelo: 0, vivo: true };
        let nivelActual = "";

        function clicPortada() {
            document.getElementById("introScreen").style.display = "none";
            if(localStorage.getItem('venecoUser')) mostrarMenu();
            else {
                document.getElementById("loginMenu").style.display = "flex";
                const container = document.getElementById("loginContainer");
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) container.innerHTML = `<button class="btn" onclick="loginTG()">ENTRAR CON TELEGRAM</button>`;
                else container.innerHTML = `<button class="btn" onclick="location.reload()">REINTENTAR</button>`;
            }
        }

        function loginTG() {
            const u = tg.initDataUnsafe.user;
            const userName = u.username ? "@" + u.username : u.first_name;
            localStorage.setItem('venecoUser', userName);
            localStorage.setItem('venecoTGID', u.id.toString());
            fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify({ accion: "puntos", usuario: userName, wallet: u.id.toString(), puntaje: 0 })});
            mostrarMenu();
        }

        async function mostrarMenu() {
            document.getElementById("loginMenu").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("logoutBtn").style.display = "block";
            document.getElementById("userNameDisplay").innerText = localStorage.getItem('venecoUser');
            document.getElementById("highScoreText").innerText = recordLocal;
            
            try {
                const res = await fetch(URL_SCRIPT + "?tipo=getUserData&id=" + localStorage.getItem('venecoTGID'));
                const data = await res.json();
                document.getElementById("currentScoreMenu").innerText = data.puntos;
            } catch (e) { document.getElementById("currentScoreMenu").innerText = "0"; }
        }

        function prepararJuego() {
            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("logoutBtn").style.display = "none";
            canvas.style.display = "block"; 
            document.getElementById("ui").style.display = "block";
            document.getElementById("levelContainer").style.display = "block";
            ajustar(); iniciar();
        }

        function ajustar() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
            chig.suelo = window.innerHeight - 200; chig.y = chig.suelo;
            chig.x = (window.innerWidth < 600) ? 30 : 100;
        }

        function iniciar() {
            activo = true; chig.vivo = true; score = 0; vel = 11; obst = [];
            bucle(); spawn();
        }

        function spawn() {
            if(!activo) return;
            let esDoble = score >= 200 && Math.random() > 0.6;
            // Definimos el ancho del obstáculo: si es doble, el área de colisión es mayor
            obst.push({ x: window.innerWidth + 150, w: esDoble ? 130 : 75, h: 85, doble: esDoble });
            let baseFreq = 1100 / (vel * 0.07);
            let delay = Math.max(baseFreq, esDoble ? 1200 : 750);
            setTimeout(spawn, delay);
        }

        function bucle() {
            if(!activo && !chig.vivo) return;
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            bgX -= vel * 0.4;
            if(bgX <= -window.innerWidth) bgX = 0;
            ctx.drawImage(imgF, bgX, 0, window.innerWidth, window.innerHeight);
            ctx.drawImage(imgF, bgX + window.innerWidth - 1, 0, window.innerWidth, window.innerHeight);

            if(activo) {
                chig.dy += chig.g; chig.y += chig.dy;
                if(chig.y > chig.suelo) { chig.y = chig.suelo; chig.dy = 0; }

                // Actualizar Récord en tiempo real
                if(score > recordLocal) {
                    recordLocal = score;
                    localStorage.setItem('venecoRunBest', recordLocal);
                    document.getElementById("highScoreText").innerText = recordLocal;
                }

                let nuevoLvl = "PRINCIPIANTE";
                if(score >= 2000) nuevoLvl = "CAOS";
                else if(score >= 1000) nuevoLvl = "AREPA";
                else if(score >= 500) nuevoLvl = "MANGO";
                else if(score >= 200) nuevoLvl = "GUACAMAYA";
                if (nuevoLvl !== nivelActual) { nivelActual = nuevoLvl; document.getElementById("levelText").innerText = nivelActual; }

                for(let i = obst.length - 1; i >= 0; i--) {
                    obst[i].x -= vel;
                    let bY = chig.suelo + (chig.h - obst[i].h);
                    
                    // CORRECCIÓN DOBLE BARRIL: Dibujar dos barriles juntos
                    if(obst[i].doble) {
                        ctx.drawImage(imgB, obst[i].x, bY, 75, obst[i].h);
                        ctx.drawImage(imgB, obst[i].x + 55, bY, 75, obst[i].h);
                    } else {
                        ctx.drawImage(imgB, obst[i].x, bY, obst[i].w, obst[i].h);
                    }

                    // Colisión
                    if (chig.x + 30 < obst[i].x + obst[i].w - 30 && chig.x + chig.w - 30 > obst[i].x + 30 && chig.y + 30 < bY + obst[i].h && chig.y + chig.h - 15 > bY) morir();
                    
                    if(obst[i].x < -200) { 
                        obst.splice(i, 1); score += 10; 
                        document.getElementById("score").innerText = score; 
                        vel += 0.15;
                    }
                }
            }
            ctx.drawImage(chig.vivo ? imgC : imgD, chig.x, chig.y, chig.w, chig.h);
            requestAnimationFrame(bucle);
        }

        function morir() {
            activo = false; chig.vivo = false;
            fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify({ accion: "puntos", usuario: localStorage.getItem('venecoUser'), wallet: localStorage.getItem('venecoTGID'), puntaje: score })});
            document.getElementById("finalScore").innerText = score; 
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        const saltar = (e) => { 
            if(e && e.type === "touchstart") e.preventDefault();
            if(activo && chig.y >= chig.suelo - 10) { 
                chig.dy = chig.salto; sndSalto.currentTime = 0; sndSalto.play(); 
            } 
        };
        window.addEventListener("touchstart", saltar, {passive: false});
        window.addEventListener("mousedown", saltar);

        function cerrarSesion() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
