<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Veneco Run</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Bloqueamos cualquier movimiento extra del navegador */
        html, body { 
            margin: 0; padding: 0; background: #000; overflow: hidden; 
            font-family: 'Arial Black', sans-serif; color: white;
            position: fixed; width: 100%; height: 100%;
            touch-action: none; -webkit-user-select: none;
        }

        #logoutBtn { position: absolute; top: 15px; right: 15px; z-index: 2000; background: #ff4444; color: white; border: 2px solid white; padding: 10px; border-radius: 10px; cursor: pointer; display: none; font-weight: bold; }
        
        #introScreen, #loginMenu, #mainMenu, #gameOverScreen { position: absolute; width: 100%; height: 100%; background-position: center; background-repeat: no-repeat; background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; }
        #introScreen { background-image: url('portada_mobile.png'); cursor: pointer; justify-content: flex-end; }
        #loginMenu { background-image: url('portada_mobile.png'); display: none; }
        #mainMenu { background: radial-gradient(circle, #1a1a1a, #000); display: none; overflow-y: auto; padding: 20px 0; }
        #gameOverScreen { background: rgba(0,0,0,0.95); display: none; }
        
        #userProfile { background: rgba(255, 204, 0, 0.15); border: 1px solid #ffcc00; padding: 12px 25px; border-radius: 20px; margin-bottom: 20px; min-width: 220px; }
        #userNameDisplay { color: #ffcc00; font-size: 18px; display: block; }
        #userPointsDisplay { font-size: 22px; color: #fff; text-shadow: 0 0 5px #ffcc00; font-weight: bold; }
        
        .play-circle { width: 110px; height: 110px; background: #2ecc71; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; cursor: pointer; box-shadow: 0 0 20px #2ecc71; border: 4px solid white; animation: pulse 2s infinite; margin-bottom: 20px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .menu-opt { width: 85%; max-width: 320px; background: rgba(255,255,255,0.08); margin: 6px 0; padding: 12px; border-radius: 18px; cursor: pointer; border: 1px solid #444; }
        
        #ui { position: absolute; top: 15px; left: 15px; z-index: 1500; display: none; pointer-events: none; }
        #scoreDisplay { font-size: 22px; color: white; text-shadow: 1px 1px 0 #000; margin: 0; }
        #levelContainer { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); z-index: 1500; text-align: center; width: 100%; display: none; pointer-events: none; }
        #levelText { font-size: 35px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 4px #000; margin: 0; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a1a; padding: 25px; border-radius: 25px; width: 85%; border: 2px solid #ffcc00; max-height: 80vh; overflow-y: auto; }
        
        /* El canvas ahora tiene un z-index específico para asegurar que reciba el touch */
        canvas { display: none; image-rendering: -webkit-optimize-contrast; cursor: pointer; touch-action: none; position: relative; z-index: 500; }
        
        .btn { padding: 15px; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 16px; text-decoration: none; display: block; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; background: #333; color: white; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>
    <button id="logoutBtn" onclick="cerrarSesion()">SALIR ✖</button>

    <div id="introScreen" onclick="clicPortada()">
        <div style="background:rgba(0,0,0,0.7); width:100%; padding:20px; margin-bottom:50px; text-shadow: 1px 1px 0 #000;">TOCA PARA INICIAR</div>
    </div>

    <div id="loginMenu">
        <div style="background:rgba(0,0,0,0.85); padding:30px; border-radius:25px; border:2px solid #ffcc00; width: 80%;">
            <h2 style="color:#ffcc00; text-shadow: 1px 1px 0 #000;">REGISTRO</h2>
            <div id="loginContainer"></div>
        </div>
    </div>

    <div id="mainMenu">
        <div id="userProfile">
            <span id="userNameDisplay">Cargando...</span>
            <div id="userPointsDisplay">RÉCORD: <span id="currentScoreMenu">0</span></div>
        </div>
        <div class="play-circle" onclick="prepararJuego()">JUGAR</div>
        <div class="menu-opt" onclick="cargarRanking()"><b>🏆 RANKING TOP 10</b><span>Ver líderes</span></div>
        <div class="menu-opt" onclick="abrirModal('modalAirdrop')"><b>💰 REGISTRAR WALLET</b><span>Wallet BNB BEP20</span></div>
        <div class="menu-opt" onclick="window.open('https://t.me/venecoinu', '_blank')"><b>📢 CANAL DE TELEGRAM</b></div>
        <div class="menu-opt" style="background: rgba(46, 204, 113, 0.2); border-color: #2ecc71;" onclick="compartirJuego()"><b>🔗 COMPARTIR JUEGO</b></div>
    </div>

    <div id="modalRank" class="modal"><div class="modal-content"><h3>TOP 10 LÍDERES</h3><div id="rankList"></div><button class="btn" onclick="cerrarModales()">CERRAR</button></div></div>
    
    <div id="modalAirdrop" class="modal">
        <div class="modal-content">
            <h3>REGISTRO WALLET</h3>
            <input type="text" id="walletInput" placeholder="0x...">
            <button class="btn" onclick="guardarWallet()">GUARDAR WALLET</button>
            <button class="btn" onclick="cerrarModales()">CERRAR</button>
        </div>
    </div>

    <div id="ui"><p id="scoreDisplay">SCORE: <span id="score">0</span></p><p id="bestDisplay" style="font-size: 14px; color: #ffcc00;">BEST: <span id="highScoreText">0</span></p></div>
    <div id="levelContainer"><p id="levelText">NIVEL MANGO</p></div>

    <div id="gameOverScreen">
        <h1 style="text-shadow: 1px 1px 0 #000;">¡FIN DEL JUEGO!</h1>
        <p>Puntos: <span id="finalScore">0</span></p>
        <button class="btn" onclick="location.reload()">VOLVER AL MENÚ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation(); // Evita cierres accidentales

        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxS64u2ud1QZ2G93d0sQpD7T2iXemvRwVvBXcVw9dvgIjpAZROBsdqnjY1OPPAopSAh/exec";

        const chigSprites = [new Image(), new Image(), new Image(), new Image()];
        chigSprites[0].src = 'chiguire.png'; chigSprites[1].src = 'chiguire2.png';
        chigSprites[2].src = 'chiguire3.png'; chigSprites[3].src = 'chiguire4.png';
        
        const imgB = new Image(); imgB.src = 'barril.png';
        const imgD = new Image(); imgD.src = 'derrota.png';
        const imgCielo = new Image(); imgCielo.src = 'cielo.png';
        const imgSuelo = new Image(); imgSuelo.src = 'suelo.png';
        const sndSalto = new Audio('salto.mp3');

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let activo = false, score = 0, vel = 11, obst = [], bgX = 0, skyX = 0, recordGlobalBD = 0;
        let chig = { x: 80, y: 0, w: 110, h: 110, dy: 0, g: 2.1, salto: -23, suelo: 0, vivo: true, frame: 0, tick: 0 };
        let estela = [];
        let nivelActual = "";
        let faseAlivioActivada = false;

        async function postData(body) {
            try { await fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify(body) }); } catch(e) {}
        }

        function clicPortada() {
            document.getElementById("introScreen").style.display = "none";
            if(localStorage.getItem('venecoUser')) mostrarMenu();
            else {
                document.getElementById("loginMenu").style.display = "flex";
                const container = document.getElementById("loginContainer");
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    container.innerHTML = `<button class="btn" onclick="loginTG()">ENTRAR CON TELEGRAM</button>`;
                } else {
                    container.innerHTML = `<a href="https://t.me/venecotoken_bot" class="btn">IR AL BOT DE TELEGRAM</a>`;
                }
            }
        }

        function loginTG() {
            const u = tg.initDataUnsafe.user;
            const userName = u.username ? "@" + u.username : u.first_name;
            localStorage.setItem('venecoUser', userName);
            localStorage.setItem('venecoTGID', u.id.toString());
            postData({ accion: "puntos", usuario: userName, wallet: u.id.toString(), puntaje: 0 });
            mostrarMenu();
        }

        async function mostrarMenu() {
            document.getElementById("loginMenu").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("logoutBtn").style.display = "block";
            const myID = localStorage.getItem('venecoTGID');
            document.getElementById("userNameDisplay").innerText = localStorage.getItem('venecoUser');
            
            try {
                const res = await fetch(URL_SCRIPT + "?tipo=getUserData&id=" + myID);
                const data = await res.json();
                recordGlobalBD = parseInt(data.puntos) || 0;
                document.getElementById("currentScoreMenu").innerText = recordGlobalBD;
                document.getElementById("highScoreText").innerText = recordGlobalBD;
                if(data.wallet) document.getElementById("walletInput").value = data.wallet;
            } catch(e) {}
        }

        function prepararJuego() {
            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("logoutBtn").style.display = "none";
            canvas.style.display = "block"; 
            document.getElementById("ui").style.display = "block";
            document.getElementById("levelContainer").style.display = "block";
            ajustar(); 
            // IMPORTANTE: Forzar el foco para capturar el primer touch
            window.focus();
            iniciar();
        }

        function ajustar() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
            chig.suelo = window.innerHeight - 220; chig.y = chig.suelo;
            chig.x = (window.innerWidth < 600) ? 25 : 100;
        }

        function iniciar() { 
            activo = true; chig.vivo = true; score = 0; vel = 11; obst = []; estela = []; 
            faseAlivioActivada = false;
            document.getElementById("score").innerText = "0";
            nivelActual = "NIVEL MANGO";
            document.getElementById("levelText").innerText = nivelActual;
            bucle(); spawn(); 
        }

        function spawn() {
            if(!activo) return;
            let esDoble = score >= 200 && Math.random() > 0.6;
            obst.push({ x: window.innerWidth + 150, w: esDoble ? 125 : 80, h: 90, doble: esDoble });
            let delay = Math.max(1100 / (vel * 0.07), esDoble ? 1100 : 700); 
            setTimeout(spawn, delay);
        }

        function bucle() {
            if(!activo && !chig.vivo) return;
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            skyX -= vel * 0.05; bgX -= vel;
            if(skyX <= -window.innerWidth) skyX = 0;
            if(bgX <= -window.innerWidth) bgX = 0;

            ctx.drawImage(imgCielo, skyX, 0, window.innerWidth, window.innerHeight);
            ctx.drawImage(imgCielo, skyX + window.innerWidth - 1, 0, window.innerWidth, window.innerHeight);
            ctx.drawImage(imgSuelo, bgX, 0, window.innerWidth, window.innerHeight);
            ctx.drawImage(imgSuelo, bgX + window.innerWidth - 1, 0, window.innerWidth, window.innerHeight);

            if(activo) {
                chig.dy += chig.g; chig.y += chig.dy;
                if(chig.y > chig.suelo) { 
                    chig.y = chig.suelo; chig.dy = 0; 
                    chig.tick++;
                    if(chig.tick > (15 / (vel/10))) { chig.frame = (chig.frame + 1) % 4; chig.tick = 0; }
                } else { chig.frame = 1; }

                // Lógica de niveles (Sin tocar fases)
                let nuevoLvl = nivelActual;
                if (score === 500 && !faseAlivioActivada) {
                    vel = 11; faseAlivioActivada = true; nuevoLvl = "¡RESPIRA!";
                    setTimeout(() => { if(score < 600) nivelActual = "NIVEL GUACAMAYA"; }, 3000);
                } else {
                    if(score >= 800) nuevoLvl = "NIVEL GUARIMBA";
                    else if(score >= 600) nuevoLvl = "NIVEL CAOS";
                    else if(score >= 400) nuevoLvl = "NIVEL GUACAMAYA";
                    else if(score >= 200) nuevoLvl = "NIVEL AREPA";
                    else nuevoLvl = "NIVEL MANGO";
                }
                if (nuevoLvl !== nivelActual) {
                    nivelActual = nuevoLvl;
                    document.getElementById("levelText").innerText = nivelActual;
                }

                if(score >= 200) vel += 0.002;

                for(let i = obst.length - 1; i >= 0; i--) {
                    obst[i].x -= vel;
                    let bY = chig.suelo + (chig.h - obst[i].h);
                    ctx.drawImage(imgB, obst[i].x, bY, obst[i].w, obst[i].h);
                    
                    if (chig.x + 35 < obst[i].x + obst[i].w - 35 && 
                        chig.x + chig.w - 35 > obst[i].x + 35 && 
                        chig.y + 35 < bY + obst[i].h && 
                        chig.y + chig.h - 15 > bY) morir();

                    if(obst[i].x < -200) { 
                        obst.splice(i, 1); score += 10; 
                        document.getElementById("score").innerText = score; 
                        vel += 0.15;
                    }
                }
            }
            const currentImg = chig.vivo ? chigSprites[chig.frame] : imgD;
            ctx.drawImage(currentImg, chig.x, chig.y, chig.w, chig.h);
            requestAnimationFrame(bucle);
        }

        function morir() {
            activo = false; chig.vivo = false;
            if (score > recordGlobalBD) {
                recordGlobalBD = score;
                postData({ accion: "puntos", usuario: localStorage.getItem('venecoUser'), wallet: localStorage.getItem('venecoTGID'), puntaje: score });
            }
            document.getElementById("finalScore").innerText = score; 
            document.getElementById("levelContainer").style.display = "none";
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        // CONTROL DE SALTO TOTALMENTE COMPATIBLE CON MÓVIL
        const manejarSalto = (e) => { 
            // Evitamos que el toque mueva la pantalla de Telegram
            if (e && e.cancelable) e.preventDefault();
            
            if(activo && chig.y >= chig.suelo - 15) { 
                chig.dy = chig.salto; 
                try { sndSalto.currentTime = 0; sndSalto.play(); } catch(e) {}
            } 
        };
        
        // Listeners globales para el salto
        window.addEventListener("touchstart", manejarSalto, {passive: false});
        window.addEventListener("mousedown", (e) => { if(e.button === 0) manejarSalto(e); });
        window.addEventListener("keydown", (e) => { if(e.code === "Space") manejarSalto(e); });
        
        function abrirModal(id) { document.getElementById(id).style.display = "flex"; }
        function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = "none"); }
        function cerrarSesion() { localStorage.clear(); location.reload(); }
        
        function guardarWallet() {
            const w = document.getElementById("walletInput").value;
            if(!w) return;
            postData({ accion: "puntos", usuario: localStorage.getItem('venecoUser'), wallet: localStorage.getItem('venecoTGID'), walletAddress: w });
            alert("Wallet Guardada!"); cerrarModales();
        }

        function compartirJuego() {
            const url = "https://t.me/venecotoken_bot/venecorun";
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent("¡Mira mi récord en Veneco Run! 🏃‍♂️💨")}`);
        }

        async function cargarRanking() {
            abrirModal('modalRank');
            const list = document.getElementById("rankList");
            list.innerHTML = "Cargando...";
            try {
                const res = await fetch(URL_SCRIPT + "?tipo=getRanking&t=" + Date.now());
                const data = await res.json();
                list.innerHTML = data.map((u, i) => `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333;"><span>${i+1}. ${u.usuario}</span> <b style="color:#ffcc00;">${u.puntaje} pts</b></div>`).join('');
            } catch(e) { list.innerHTML = "Error conexión"; }
        }
    </script>
</body>
</html>
