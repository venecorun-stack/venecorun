<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
    /* ... (mismo CSS anterior) ... */
    .btn-tg { background: #0088cc; color: white; box-shadow: 0px 5px 0px #005580; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
</style>

<div id="loginMenu">
    <div class="login-box">
        <h2 style="color:#ffcc00; margin-top:0; letter-spacing: 2px;">REGISTRO AIRDROP</h2>
        <p id="tgStatus" style="font-size: 14px; margin-bottom: 20px;">Detectando cuenta de Telegram...</p>
        
        <button id="btnEntrarTG" class="btn btn-tg" onclick="loginTelegram()" style="display:none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.35-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.36-.48.99-.74 3.84-1.67 6.41-2.77 7.7-3.31 3.64-1.53 4.4-1.8 4.89-1.81.11 0 .35.03.5.16.13.11.17.26.18.37 0 .07.01.21 0 .33z"/></svg>
            JUGAR AHORA
        </button>
    </div>
</div>

<script>
    // Inicializar Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand(); // Expande el mini-app a pantalla completa

    // ... (variables de imágenes y sonidos igual) ...

    function clicPortada() { 
        sndClick.play(); sndIntro.play(); 
        document.getElementById("introScreen").style.display = "none"; 
        
        if(localStorage.getItem('venecoUser')) {
            prepararJuego(); 
        } else {
            document.getElementById("loginMenu").style.display = "flex";
            verificarUsuarioTelegram();
        }
    }

    function verificarUsuarioTelegram() {
        const user = tg.initDataUnsafe?.user;
        const statusText = document.getElementById("tgStatus");
        const btn = document.getElementById("btnEntrarTG");

        if (user) {
            // Si el usuario tiene @username lo usamos, si no, su nombre + ID
            const nombreUsuario = user.username ? `@${user.username}` : `${user.first_name}_${user.id}`;
            statusText.innerText = "Bienvenido, " + nombreUsuario;
            statusText.style.color = "#00ff00";
            btn.style.display = "flex";
            // Guardamos temporalmente para la función de login
            window.tgDetectedUser = nombreUsuario;
        } else {
            statusText.innerText = "Error: Abre el juego desde Telegram";
            statusText.style.color = "#ff4444";
        }
    }

    function loginTelegram() {
        if (window.tgDetectedUser) {
            sndClick.play();
            localStorage.setItem('venecoUser', window.tgDetectedUser);
            localStorage.setItem('venecoWallet', "Telegram_Auth"); // Mantenemos el campo para el Excel
            
            document.getElementById("loginMenu").style.display = "none";
            prepararJuego();
        }
    }

    // El resto de la lógica (prepararJuego, morir, enviarDatosExcel, etc.) se mantiene IGUAL
</script>
