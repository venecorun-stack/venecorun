<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - Diversión y Airdrop</title>
    <style>
        /* Mantenemos todo tu estilo original */
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; touch-action: none; }
        #introScreen, #loginMenu, #mainMenu, #gameOverScreen, #rankingModal, #funWarning { 
            position: absolute; width: 100%; height: 100%; background-color: #000;
            background-position: center; background-repeat: no-repeat; background-size: contain;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 900; text-align: center; 
        }
        #introScreen { background-image: url('portada.png'); cursor: pointer; justify-content: flex-end; }
        #loginMenu, #mainMenu { background-image: url('portada.png'); display: none; }
        
        /* NUEVO: Modal de Advertencia */
        #funWarning { display: none; background: rgba(0,0,0,0.95); z-index: 1005; }
        .warning-box { background: #111; padding: 30px; border: 2px solid #ff4444; border-radius: 30px; width: 85%; max-width: 320px; }
        
        .login-box { background: rgba(10, 10, 10, 0.95); padding: 25px; border: 1px solid #ffcc00; border-radius: 30px; width: 85%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #333; font-size: 14px; background: #000; color: white; outline: none; }
        
        .btn { padding: 12px 25px; font-size: 16px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; margin-top: 10px; width: 100%; box-shadow: 0px 4px 0px #b38f00; }
        .btn-fun { background: transparent; color: #aaa; border: 1px solid #444; box-shadow: none; font-size: 13px; margin-top: 15px; }
        
        /* Botones de advertencia */
        .btn-continue { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; margin-bottom: 10px; }
        .btn-back { background: #ff0000; color: #fff; box-shadow: 0 0 15px #ff0000; }

        canvas { display: none; image-rendering: -webkit-optimize-contrast; width: 100vw; height: 100vh; }
        /* ... resto de estilos del juego ... */
        .btn-play-neon { width: 115px; height: 115px; border-radius: 50%; background: #ffcc00; color: #000; font-size: 20px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 0 15px #ffcc00, 0 0 30px #ffcc00; margin: 15px 0; display: flex; align-items: center; justify-content: center; text-transform: uppercase; animation: pulse-neon 1.5s infinite; }
        @keyframes pulse-neon { 0% { box-shadow: 0 0 15px #ffcc00; transform: scale(1); } 50% { box-shadow: 0 0 40px #ffcc00; transform: scale(1.05); } 100% { box-shadow: 0 0 15px #ffcc00; transform: scale(1); } }
        #ui, #levelContainer, #gameOverScreen, #rankingModal { display: none; }
        .score-text { font-size: 22px; color: white; text-shadow: 2px 2px 0 #000; margin: 0; }
    </style>
</head>
<body>

    <div id="introScreen" onclick="clicPortada()">
        <div style="font-size:24px; color:white; margin-bottom:80px; text-shadow: 0 0 15px #ffcc00; background: rgba(0,0,0,0.5); width:100%;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu">
        <div class="login-box">
            <h2 style="color:#ffcc00; margin-top:0;">REGISTRO AIRDROP</h2>
            <input type="text" id="tgUser" placeholder="Usuario">
            <input type="text" id="bnbWallet" placeholder="Wallet BNB BEP20 (Metamask)">
            <button class="btn" id="btnLogin" onclick="autenticarYEntrar()">REGISTRARSE / ENTRAR</button>
            
            <button class="btn btn-fun" onclick="mostrarAdvertencia()">JUGAR POR DIVERSIÓN</button>
            <div id="loadingLogin" style="display:none; color:#ffcc00; font-size:12px; margin-top:10px;">Cargando...</div>
        </div>
    </div>

    <div id="funWarning">
        <div class="warning-box">
            <h2 style="color:#ff4444; margin-top:0;">¡ATENCIÓN!</h2>
            <p style="font-size:16px; line-height:1.4;">En esta modalidad <b>no recibirá airdrop</b> ni premios oficiales.</p>
            <button class="btn btn-continue" onclick="entrarComoInvitado()">CONTINUAR</button>
            <button class="btn btn-back" onclick="ocultarAdvertencia()">VOLVER ATRÁS</button>
        </div>
    </div>

    <div id="mainMenu">
        <div class="login-box" style="border-color: #00ffff;">
            <p style="color:#aaa; font-size: 11px; margin: 0;">PLAYER PROFILE</p>
            <h2 id="userNameTitle" style="color:#fff; margin: 5px 0 10px 0; font-size: 26px;">USUARIO</h2>
            <div style="display: flex; justify-content: center;">
                <button class="btn-play-neon" onclick="prepararJuego()">JUGAR</button>
            </div>
            <p id="menuBestScore" style="margin: 0 0 15px 0; color: #00ffff; font-size: 14px;">Record: 0 pts</p>
            <button class="btn" style="background:transparent; border:1px solid #00ffff; color:#00ffff;" onclick="verRanking()">🏆 RANKING GLOBAL</button>
            <button class="btn" style="background:transparent; color:#ff4444; border:1px solid #ff4444; font-size:12px; margin-top:20px;" onclick="cerrarSesion()">CERRAR SESIÓN ✖</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzowQ8z7hoY0lWT-l1KqrBO2Zfq7VtmXUAsjRair1mCSlYS-JpuGizgWCPpEv1ev4B0cg/exec";

        // Imágenes y Sonidos (Se mantienen igual)
        const imgC1 = new Image(); imgC1.src = 'chiguire.png';
        const imgC2 = new Image(); imgC2.src = 'chiguire2.png';
        const imgC3 = new Image(); imgC3.src = 'chiguire3.png';
        const imgC4 = new Image(); imgC4.src = 'chiguire4.png';
        const imgD = new Image(); imgD.src = 'derrota.png';
        const imgB = new Image(); imgB.src = 'barril.png';
        const imgCielo = new Image(); imgCielo.src = 'cielo.png';
        const imgSuelo = new Image(); imgSuelo.src = 'suelo.png';
        const sndClick = new Audio('click.mp3');
        const musFondo = new Audio('musicafondo.mp3'); musFondo.loop = true;
        const sndIntro = new Audio('intro.mp3'); sndIntro.loop = true;

        let activo = false, score = 0, vel = 11, recordGlobal = 0;
        let chig = { x: 80, y: 0, w: 110, h: 110, dy: 0, g: 2.1, salto: -23, suelo: 0, vivo: true };
        let ultimoTiempo = 0; const fpsObjetivo = 1000/60;

        function clicPortada() { sndClick.play(); sndIntro.play(); document.getElementById("introScreen").style.display = "none"; if(localStorage.getItem('venecoUser')) mostrarMenuPrincipal(); else document.getElementById("loginMenu").style.display = "flex"; }
        
        // FUNCIONES DE ADVERTENCIA
        function mostrarAdvertencia() { document.getElementById("funWarning").style.display = "flex"; }
        function ocultarAdvertencia() { document.getElementById("funWarning").style.display = "none"; }
        
        function entrarComoInvitado() {
            localStorage.setItem('venecoUser', 'Invitado');
            localStorage.setItem('venecoWallet', 'no-wallet');
            localStorage.setItem('venecoRunHighScore', 0);
            recordGlobal = 0;
            ocultarAdvertencia();
            document.getElementById("loginMenu").style.display = "none";
            mostrarMenuPrincipal();
        }

        async function autenticarYEntrar() {
            const u = document.getElementById("tgUser").value.trim();
            const w = document.getElementById("bnbWallet").value.trim();
            if(u.length < 3 || !/^0x[a-fA-F0-9]{40}$/.test(w)) { alert("Datos inválidos"); return; }
            
            document.getElementById("loadingLogin").style.display = "block";
            try {
                const res = await fetch(URL_SCRIPT + "?action=getScore&wallet=" + w);
                const data = await res.json();
                localStorage.setItem('venecoUser', u);
                localStorage.setItem('venecoWallet', w);
                recordGlobal = data.score || 0;
                localStorage.setItem('venecoRunHighScore', recordGlobal);
                document.getElementById("loginMenu").style.display = "none";
                mostrarMenuPrincipal();
            } catch (e) { alert("Error de conexión"); }
            document.getElementById("loadingLogin").style.display = "none";
        }

        function mostrarMenuPrincipal() {
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("userNameTitle").innerText = localStorage.getItem('venecoUser').toUpperCase();
            document.getElementById("menuBestScore").innerText = "Record: " + (localStorage.getItem('venecoRunHighScore') || 0);
        }

        function cerrarSesion() { localStorage.clear(); location.reload(); }

        // Lógica de juego simplificada para el ejemplo (Bucle, ajustar, etc. igual que antes)
        function ajustar() { 
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr); chig.suelo = window.innerHeight - 220; chig.y = chig.suelo;
        }

        function prepararJuego() { 
            document.getElementById("mainMenu").style.display = "none";
            canvas.style.display = "block"; ajustar(); iniciar();
            sndIntro.pause(); musFondo.play();
        }

        function iniciar() { activo = true; score = 0; bgX_cielo = 0; bgX_suelo = 0; ultimoTiempo = performance.now(); requestAnimationFrame(bucle); }

        function bucle(t) {
            if(!activo) return;
            const delta = t - ultimoTiempo;
            if(delta >= fpsObjetivo) {
                ultimoTiempo = t - (delta % fpsObjetivo);
                ctx.clearRect(0,0,window.innerWidth, window.innerHeight);
                // Dibujo de fondo y chigüire igual que antes...
                // (Para ahorrar espacio aquí no repito todo el dibujo del bucle que ya tienes perfecto)
                // Asegúrate de copiar el resto del código de movimiento y dibujo aquí abajo.
            }
            requestAnimationFrame(bucle);
        }
    </script>
</body>
</html>
