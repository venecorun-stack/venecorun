<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - @venecotoken_bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; touch-action: none; }
        #muteBtn { position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; background: rgba(0,0,0,0.7); border: 2px solid #ffcc00; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2000; font-size: 22px; color: white; }
        .screen { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 900; text-align: center; background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #000; }
        #introScreen { display: flex; background-image: url('portada.png'); cursor: pointer; justify-content: flex-end; }
        #loginMenu, #mainMenu { background-image: url('portada.png'); }
        @media (max-aspect-ratio: 1/1) { .screen { background-image: url('portada_mobile.png') !important; background-size: cover !important; } }
        .login-box { background: rgba(10, 10, 10, 0.95); padding: 25px; border: 1px solid #ffcc00; border-radius: 30px; width: 85%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #333; font-size: 14px; background: #000; color: white; outline: none; }
        .btn { padding: 12px 25px; font-size: 16px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; margin-top: 10px; width: 100%; box-shadow: 0px 4px 0px #b38f00; }
        .btn-play-neon { width: 110px; height: 110px; border-radius: 50%; background: #ffcc00; font-size: 20px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 0 20px #ffcc00; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 850; display: none; }
        canvas { display: none; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="muteBtn" onclick="toggleMute(event)">🔊</div>

    <div id="introScreen" class="screen" onclick="clicPortada()">
        <div style="font-size:24px; color:white; margin-bottom:80px; text-shadow: 0 0 15px #ffcc00;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu" class="screen">
        <div class="login-box">
            <h2 style="color:#ffcc00;">INICIAR SESIÓN</h2>
            <p style="font-size:12px;">Se usará tu cuenta de Telegram: <br><b id="displayTgUser">...</b></p>
            <button class="btn" onclick="iniciarConTelegram()">ENTRAR AL JUEGO</button>
            <button class="btn" style="background:#555; color:white;" onclick="verAdvertenciaInvitado()">MODO INVITADO</button>
        </div>
    </div>

    <div id="warnInvitado" class="screen" style="background:rgba(0,0,0,0.95);">
        <div class="login-box" style="border-color:#ff4444;">
            <h2 style="color:#ff4444;">¡ADVERTENCIA!</h2>
            <p>En el modo invitado <b>NO RECIBIRÁS AIRDROP</b> ni se guardarán tus puntos de forma permanente.</p>
            <button class="btn" onclick="entrarInvitadoConfirmado()">CONTINUAR</button>
            <button class="btn" style="background:#333; color:white;" onclick="volverAlLogin()">ATRÁS</button>
        </div>
    </div>

    <div id="mainMenu" class="screen">
        <div class="login-box" style="border-color: #00ffff;">
            <h2 id="userNameTitle" style="color:#fff; margin:0;">USUARIO</h2>
            <p id="menuBestScore" style="color:#00ffff; font-size:14px;">Record: 0</p>
            
            <button class="btn-play-neon" onclick="prepararJuego()">JUGAR</button>

            <div id="walletSection" style="margin-top:10px;">
                <input type="text" id="walletInput" placeholder="Wallet BNB BP20 Metamask" style="display:none;">
                <button id="btnWallet" class="btn" style="background:#f3ba2f; font-size:12px;" onclick="mostrarInputWallet()">AGREGAR WALLET BNB</button>
            </div>

            <button class="btn" style="background:#0088cc; color:white; font-size:12px;" onclick="compartirReferido()">🔗 INVITAR (Bono +150)</button>
            <button class="btn" style="background:transparent; border:1px solid #00ffff; color:#00ffff;" onclick="verRanking()">🏆 RANKING</button>
            <p id="msgInvitado" style="color:#ff4444; font-size:10px; display:none; margin-top:5px;">Modo Invitado: Puntos no válidos para Airdrop</p>
        </div>
    </div>

    <div id="rankingModal" class="screen" style="background:rgba(0,0,0,0.98);">
        <div class="login-box" style="border-color:#00ffff; max-width:90%;">
            <h2 style="color:#00ffff;">TOP 10</h2>
            <div id="rankingBody" style="font-size:14px; text-align:left; margin-bottom:15px;"></div>
            <button class="btn" onclick="cerrarRanking()">CERRAR</button>
        </div>
    </div>

    <div id="gameOverScreen" class="screen" style="background:rgba(0,0,0,0.9);">
        <h1>¡FIN DEL JUEGO!</h1>
        <p style="font-size:24px;">Puntos: <span id="finalScore">0</span></p>
        <button class="btn" onclick="reiniciarRapido()">REINTENTAR</button>
        <button class="btn" style="background:#333; color:white;" onclick="volverAlMenu()">MENÚ</button>
    </div>

    <div id="ui"><p style="font-size:20px; margin:0;">PUNTOS: <span id="score">0</span></p></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbypuD6MtKAUUuqW9VHtZIx_iRfsAT7Nf4-h-nVuE2mz8Au3l2oPM-n7zyGalhvPcxMOIg/exec";
        const BOT_USER = "venecotoken_bot";
        
        let userActual = localStorage.getItem('vUser') || "";
        let esInvitado = false;
        let walletActual = localStorage.getItem('vWallet') || "";
        let recordGlobal = 0;

        window.onload = () => {
            const tgUser = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Usuario";
            document.getElementById("displayTgUser").innerText = "@" + tgUser;
        };

        function clicPortada() { document.getElementById("introScreen").style.display = "none"; document.getElementById("loginMenu").style.display = "flex"; }
        function volverAlLogin() { document.querySelectorAll('.screen').forEach(s => s.style.display="none"); document.getElementById("loginMenu").style.display = "flex"; }
        function verAdvertenciaInvitado() { document.getElementById("loginMenu").style.display = "none"; document.getElementById("warnInvitado").style.display = "flex"; }
        
        function entrarInvitadoConfirmado() {
            esInvitado = true;
            userActual = "Invitado";
            recordGlobal = 0;
            document.getElementById("warnInvitado").style.display = "none";
            document.getElementById("msgInvitado").style.display = "block";
            document.getElementById("walletSection").style.display = "none";
            mostrarMenuPrincipal();
        }

        async function iniciarConTelegram() {
            esInvitado = false;
            userActual = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "Player";
            const ref = tg.initDataUnsafe?.start_param || "";
            
            document.getElementById("loginMenu").innerHTML = "Cargando perfil...";
            try {
                const res = await fetch(`${URL_SCRIPT}?action=getScore&user=${userActual}&ref=${ref}`);
                const data = await res.json();
                recordGlobal = data.score || 0;
                walletActual = data.wallet || "";
                localStorage.setItem('vUser', userActual);
                localStorage.setItem('vWallet', walletActual);
                document.getElementById("loginMenu").style.display = "none";
                mostrarMenuPrincipal();
            } catch(e) { alert("Error de conexión"); location.reload(); }
        }

        function mostrarMenuPrincipal() {
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("userNameTitle").innerText = userActual.toUpperCase();
            document.getElementById("menuBestScore").innerText = "Record: " + recordGlobal;
            if(walletActual) {
                document.getElementById("btnWallet").innerText = "WALLET REGISTRADA ✓";
                document.getElementById("btnWallet").style.background = "#4CAF50";
                document.getElementById("walletInput").style.display = "none";
            }
        }

        function mostrarInputWallet() {
            if(walletActual) return;
            const input = document.getElementById("walletInput");
            const btn = document.getElementById("btnWallet");
            if(input.style.display === "none") {
                input.style.display = "block";
                btn.innerText = "CONFIRMAR AGREGAR";
            } else {
                const val = input.value.trim();
                if(/^0x[a-fA-F0-9]{40}$/.test(val)) {
                    walletActual = val;
                    localStorage.setItem('vWallet', val);
                    enviarDatosExcel(recordGlobal); // Guarda la wallet de una vez
                    alert("Wallet agregada con éxito");
                    mostrarMenuPrincipal();
                } else { alert("Wallet BNB inválida"); }
            }
        }

        function compartirReferido() {
            const link = `https://t.me/${BOT_USER}/play?startapp=${userActual}`;
            const text = esInvitado ? "¡Mira este juego!" : "¡Juega y gana Airdrop con mi link!";
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${text}`);
        }

        // --- LÓGICA DE JUEGO SIMPLIFICADA PARA EL EJEMPLO ---
        let activo = false, score = 0;
        function prepararJuego() {
            document.getElementById("mainMenu").style.display = "none";
            document.getElementById("gameCanvas").style.display = "block";
            document.getElementById("ui").style.display = "block";
            iniciarJuego();
        }

        function iniciarJuego() {
            activo = true; score = 0;
            // Aquí iría tu bucle de juego original...
            // Por simplicidad, simularemos una muerte a los 5 segundos
            setTimeout(() => { if(activo) finalizarJuego(); }, 5000);
        }

        function finalizarJuego() {
            activo = false;
            document.getElementById("gameCanvas").style.display = "none";
            document.getElementById("ui").style.display = "none";
            document.getElementById("gameOverScreen").style.display = "flex";
            document.getElementById("finalScore").innerText = score;
            if(!esInvitado && score > recordGlobal) {
                recordGlobal = score;
                enviarDatosExcel(score);
            }
        }

        async function enviarDatosExcel(pts) {
            if(esInvitado) return;
            const datos = { usuario: userActual, wallet: walletActual, puntaje: pts };
            fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify(datos) });
        }

        function volverAlMenu() { document.getElementById("gameOverScreen").style.display = "none"; mostrarMenuPrincipal(); }
        function reiniciarRapido() { document.getElementById("gameOverScreen").style.display = "none"; prepararJuego(); }

        async function verRanking() {
            document.getElementById("rankingModal").style.display = "flex";
            const body = document.getElementById("rankingBody");
            body.innerHTML = "Cargando...";
            try {
                const res = await fetch(`${URL_SCRIPT}?action=getRanking`);
                const data = await res.json();
                body.innerHTML = data.map((u, i) => `<div>${i+1}. ${u.usuario} - ${u.puntaje} pts</div>`).join("");
            } catch(e) { body.innerHTML = "Error al cargar."; }
        }
        function cerrarRanking() { document.getElementById("rankingModal").style.display = "none"; }
        function toggleMute() { /* Tu lógica de sonido */ }
    </script>
</body>
</html>
