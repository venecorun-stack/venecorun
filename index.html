<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - @venecotoken_bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; touch-action: none; }
        
        #muteBtn { 
            position: fixed; top: 20px; right: 20px; width: 45px; height: 45px; 
            background: rgba(0,0,0,0.7); border: 2px solid #ffcc00; border-radius: 50%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            z-index: 2000; font-size: 22px; color: white; transition: 0.2s;
        }

        #introScreen, #loginMenu, #mainMenu, #gameOverScreen, #rankingModal, #funWarning { 
            position: absolute; width: 100%; height: 100%; background-color: #000;
            background-position: center; background-repeat: no-repeat; background-size: contain;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 900; text-align: center; 
        }
        #introScreen { background-image: url('portada.png'); cursor: pointer; justify-content: flex-end; }
        #loginMenu, #mainMenu { background-image: url('portada.png'); display: none; }
        
        @media (max-aspect-ratio: 1/1) { #introScreen, #loginMenu, #mainMenu { background-image: url('portada_mobile.png') !important; background-size: cover !important; } }

        .login-box { background: rgba(10, 10, 10, 0.95); padding: 25px; border: 1px solid #ffcc00; border-radius: 30px; width: 85%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #333; font-size: 14px; background: #000; color: white; outline: none; }
        
        .btn { padding: 12px 25px; font-size: 16px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; margin-top: 10px; width: 100%; box-shadow: 0px 4px 0px #b38f00; transition: 0.2s; }
        .btn-task { background: #0088cc; color: white; box-shadow: 0px 4px 0px #005580; margin-top: 10px; font-size: 13px; }

        .btn-play-neon { width: 115px; height: 115px; border-radius: 50%; background: #ffcc00; color: #000; font-size: 20px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 0 15px #ffcc00, 0 0 30px #ffcc00; margin: 15px 0; display: flex; align-items: center; justify-content: center; text-transform: uppercase; animation: pulse-neon 1.5s infinite; }
        @keyframes pulse-neon { 0% { box-shadow: 0 0 15px #ffcc00; transform: scale(1); } 50% { box-shadow: 0 0 40px #ffcc00; transform: scale(1.05); } 100% { box-shadow: 0 0 15px #ffcc00; transform: scale(1); } }

        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 20px; }
        .social-item { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px; border-radius: 15px; font-size: 12px; font-weight: bold; text-decoration: none; color: white; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }

        #ui { position: absolute; top: 10px; left: 10px; z-index: 850; display: none; pointer-events: none; }
        .score-text { font-size: 22px; color: white; text-shadow: 2px 2px 0 #000; margin: 0; }
        #levelContainer { position: absolute; top: 15px; right: 80px; z-index: 800; display: none; }
        #levelText { font-size: 18px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 5px; }

        #rankingModal { background: rgba(0,0,0,0.98); display: none; z-index: 1200; }
        .ranking-content { background: #111; padding: 20px; border: 1px solid #00ffff; border-radius: 20px; width: 90%; max-width: 400px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; color: white; font-size: 14px; }
        th { border-bottom: 2px solid #00ffff; padding: 10px; color: #00ffff; }
        td { padding: 10px; border-bottom: 1px solid #333; }

        #gameOverScreen { background: rgba(0,0,0,0.95); display: none; }
        canvas { display: none; image-rendering: -webkit-optimize-contrast; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="muteBtn" onclick="toggleMute(event)">🔊</div>

    <div id="introScreen" onclick="clicPortada()">
        <div style="font-size:24px; color:white; margin-bottom:80px; text-shadow: 0 0 15px #ffcc00; background: rgba(0,0,0,0.5); width:100%;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu">
        <div class="login-box">
            <h2 style="color:#ffcc00; margin-top:0;">REGISTRO AIRDROP</h2>
            <input type="text" id="tgUser" placeholder="Usuario" readonly>
            <input type="text" id="bnbWallet" placeholder="Wallet BNB BEP20 (Metamask)">
            <button class="btn" onclick="autenticarYEntrar()">REGISTRARSE / ENTRAR</button>
            <div id="loadingLogin" style="display:none; color:#ffcc00; font-size:12px; margin-top:10px;">Cargando...</div>
        </div>
    </div>

    <div id="mainMenu">
        <div class="login-box" style="border-color: #00ffff;">
            <p style="color:#aaa; font-size: 11px; margin: 0;">PLAYER PROFILE</p>
            <h2 id="userNameTitle" style="color:#fff; margin: 5px 0 10px 0; font-size: 26px;">USUARIO</h2>
            <button class="btn-play-neon" style="margin: 15px auto;" onclick="prepararJuego()">JUGAR</button>
            <p id="menuBestScore" style="margin: 0 0 5px 0; color: #00ffff; font-size: 14px;">Record: 0 pts</p>
            
            <button id="btnTaskTG" class="btn btn-task" onclick="realizarTareaTelegram()">🚀 SEGUIR TELEGRAM (+100 PTS)</button>
            <button class="btn" style="background:#ffcc00; color:#000; font-size:12px; margin-top:10px;" onclick="compartirReferido()">🔗 INVITAR AMIGO (+50 PTS)</button>
            
            <button class="btn" style="background:transparent; border:1px solid #00ffff; color:#00ffff; margin-top:15px;" onclick="verRanking()">🏆 RANKING GLOBAL</button>
            <div class="social-grid">
                <a href="https://t.me/venecoinu" target="_blank" class="social-item">Telegram</a>
                <a href="https://x.com/veneco_toke" target="_blank" class="social-item">Twitter</a>
            </div>
            <button class="btn" style="background:transparent; color:#ff4444; border:1px solid #ff4444; font-size:12px; margin-top:15px;" onclick="cerrarSesion()">CERRAR SESIÓN ✖</button>
        </div>
    </div>

    <div id="rankingModal">
        <div class="ranking-content">
            <h2 style="color:#00ffff; margin-top:0;">TOP 10 PLAYERS</h2>
            <div id="loadingRank" style="font-size: 12px; color: #ffcc00;">Cargando...</div>
            <table><thead><tr><th>#</th><th>Usuario</th><th>Puntos</th></tr></thead><tbody id="rankingBody"></tbody></table>
            <button class="btn" style="margin-top:20px; background:#00ffff; color:#000;" onclick="cerrarRanking()">VOLVER</button>
        </div>
    </div>

    <div id="ui">
        <p class="score-text">PUNTOS: <span id="score">0</span></p>
        <p style="color: #ffcc00; font-size: 14px; margin:0;">RECORD: <span id="highScoreText">0</span></p>
    </div>

    <div id="levelContainer"><p id="levelText">NIVEL AREPA</p></div>

    <div id="gameOverScreen">
        <h1 style="color:#ff4444; font-size:35px;">¡FIN DEL JUEGO!</h1>
        <div class="login-box" style="margin-bottom: 20px;">
            <p style="font-size:24px; margin:0;">Puntos: <span id="finalScore">0</span></p>
            <p style="font-size:18px; color:#ffcc00; margin:0;">Récord: <span id="finalBest">0</span></p>
        </div>
        <button class="btn" onclick="reiniciarRapido()">REINTENTAR</button>
        <button class="btn" style="background:rgba(255,255,255,0.1); color:white;" onclick="volverAlMenu()">VOLVER AL MENÚ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // TU SCRIPT ACTUALIZADO
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzIXrc1ztKn681UkwkU2nbCxPYAuH-xJZIqu1zoMiNewW0dSFmHU_hDQtJYqBlxoO7iuA/exec";
        const BOT_USER = "venecotoken_bot";

        const imgC1 = new Image(); imgC1.src = 'chiguire.png';
        const imgC2 = new Image(); imgC2.src = 'chiguire2.png';
        const imgC3 = new Image(); imgC3.src = 'chiguire3.png';
        const imgC4 = new Image(); imgC4.src = 'chiguire4.png';
        const imgD = new Image(); imgD.src = 'derrota.png';
        const imgB = new Image(); imgB.src = 'barril.png';
        const imgCielo = new Image(); imgCielo.src = 'cielo.png';
        const imgSuelo = new Image(); imgSuelo.src = 'suelo.png';

        const sndClick = new Audio('click.mp3');
        const sndSalto = new Audio('salto.mp3');
        const sndPerder = new Audio('perder.mp3');
        const musFondo = new Audio('musicafondo.mp3'); musFondo.loop = true;
        const sndIntro = new Audio('intro.mp3'); sndIntro.loop = true;

        let activo = false, score = 0, vel = 11, obst = [], bgX_cielo = 0, bgX_suelo = 0, frameAnim = 0;
        let recordGlobal = localStorage.getItem('venecoRunHighScore') || 0;
        let chig = { x: 80, y: 0, w: 110, h: 110, dy: 0, g: 2.1, salto: -23, suelo: 0, vivo: true };
        let estela = [], ultimoTiempo = 0, muted = false;
        const fpsObjetivo = 1000 / 60; 

        window.onload = () => {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById("tgUser").value = tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name;
            }
        };

        function toggleMute(e) {
            if(e) e.stopPropagation();
            muted = !muted;
            const btn = document.getElementById("muteBtn");
            btn.innerText = muted ? "🔇" : "🔊";
            [sndClick, sndSalto, sndPerder, musFondo, sndIntro].forEach(s => { s.muted = muted; if(muted) s.pause(); });
            if(!muted) { if(activo) musFondo.play(); else if(document.getElementById("introScreen").style.display === "none") sndIntro.play(); }
        }

        async function autenticarYEntrar() {
            const u = document.getElementById("tgUser").value.trim();
            const w = document.getElementById("bnbWallet").value.trim().toLowerCase();
            const ref = tg.initDataUnsafe.start_param || "";

            if(u.length < 3 || !/^0x[a-fA-F0-9]{40}$/.test(w)) { alert("Datos inválidos"); return; }
            document.getElementById("loadingLogin").style.display = "block";
            try {
                const response = await fetch(`${URL_SCRIPT}?action=getScore&wallet=${w}&user=${u}&ref=${ref}`);
                const data = await response.json();
                localStorage.setItem('venecoUser', u); localStorage.setItem('venecoWallet', w);
                recordGlobal = data.score || 0;
                localStorage.setItem('venecoRunHighScore', recordGlobal);
                document.getElementById("loginMenu").style.display = "none"; mostrarMenuPrincipal();
            } catch (e) { alert("Error de conexión"); }
            document.getElementById("loadingLogin").style.display = "none";
        }

        async function realizarTareaTelegram() {
            window.open("https://t.me/venecoinu", "_blank");
            const w = localStorage.getItem('venecoWallet');
            setTimeout(async () => {
                try {
                    const res = await fetch(`${URL_SCRIPT}?action=taskTelegram&wallet=${w}`);
                    const data = await res.json();
                    if(data.success) {
                        alert("¡Bonos +100 acreditados!");
                        recordGlobal = parseInt(recordGlobal) + 100;
                        document.getElementById("menuBestScore").innerText = "Record: " + recordGlobal;
                        document.getElementById("btnTaskTG").style.display = "none";
                    }
                } catch(e) {}
            }, 3000);
        }

        function compartirReferido() {
            const user = localStorage.getItem('venecoUser');
            const link = `https://t.me/${BOT_USER}/play?startapp=${user}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=¡Juega Veneco Run y acumula puntos! 🚀`);
        }

        function clicPortada() { if(!muted) { sndClick.play(); sndIntro.play(); } document.getElementById("introScreen").style.display = "none"; if(localStorage.getItem('venecoUser')) mostrarMenuPrincipal(); else document.getElementById("loginMenu").style.display = "flex"; }
        function mostrarMenuPrincipal() { document.getElementById("mainMenu").style.display = "flex"; document.getElementById("userNameTitle").innerText = localStorage.getItem('venecoUser').toUpperCase(); document.getElementById("menuBestScore").innerText = "Record: " + recordGlobal; }
        function prepararJuego() { document.getElementById("mainMenu").style.display = "none"; document.getElementById("ui").style.display = "block"; document.getElementById("levelContainer").style.display = "block"; canvas.style.display = "block"; ajustar(); sndIntro.pause(); musFondo.currentTime = 0; if(!muted) musFondo.play(); document.getElementById("highScoreText").innerText = recordGlobal; iniciar(); }
        function ajustar() { const dpr = window.devicePixelRatio || 1; canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr; canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px'; ctx.scale(dpr, dpr); chig.suelo = window.innerHeight - 220; chig.y = chig.suelo; chig.x = window.innerWidth < 600 ? 30 : 100; }
        function iniciar() { activo = true; chig.vivo = true; score = 0; vel = 11; obst = []; frameAnim = 0; estela = []; bgX_cielo = 0; bgX_suelo = 0; ultimoTiempo = performance.now(); requestAnimationFrame(bucle); setTimeout(spawn, 2000); }
        
        async function enviarDatosExcel(puntos) { 
            const datos = { usuario: localStorage.getItem('venecoUser'), wallet: localStorage.getItem('venecoWallet'), puntaje: puntos }; 
            fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", body: JSON.stringify(datos) });
        }

        function morir() { activo = false; chig.vivo = false; musFondo.pause(); if(!muted) sndPerder.play(); if(score > recordGlobal) { recordGlobal = score; localStorage.setItem('venecoRunHighScore', recordGlobal); enviarDatosExcel(recordGlobal); } document.getElementById("finalScore").innerText = score; document.getElementById("finalBest").innerText = recordGlobal; document.getElementById("gameOverScreen").style.display = "flex"; }
        function reiniciarRapido() { document.getElementById("gameOverScreen").style.display = "none"; musFondo.currentTime = 0; if(!muted) musFondo.play(); iniciar(); }
        function volverAlMenu() { document.getElementById("gameOverScreen").style.display = "none"; canvas.style.display = "none"; document.getElementById("ui").style.display = "none"; document.getElementById("levelContainer").style.display = "none"; if(!muted) sndIntro.play(); mostrarMenuPrincipal(); }
        function cerrarSesion() { localStorage.clear(); location.reload(); }

        const saltar = (e) => { if(e && e.target.id === 'muteBtn') return; if(activo && chig.y >= chig.suelo - 10) { chig.dy = chig.salto; if(!muted) { sndSalto.currentTime = 0; sndSalto.play(); } } };
        window.addEventListener("mousedown", saltar); window.addEventListener("touchstart", (e) => { if(activo && e.target.id !== 'muteBtn') { e.preventDefault(); saltar(e); } }, {passive: false});
        window.addEventListener("keydown", (e) => { if(e.code === "Space") { e.preventDefault(); saltar(); } });

        function spawn() { if(!activo) return; let esDoble = score >= 200 && Math.random() > 0.6; obst.push({ x: window.innerWidth + 150, w: esDoble ? 125 : 80, h: 90, doble: esDoble }); setTimeout(spawn, Math.max(1100 / (vel * 0.07), esDoble ? 1100 : 700)); }

        function actualizarNivel() {
            const lbl = document.getElementById("levelText");
            if(score >= 600) { lbl.innerText = "CAOS LLANERO"; lbl.style.color = "red"; }
            else if(score >= 400) { lbl.innerText = "NIVEL GUACAMAYA"; }
            else if(score >= 200) { lbl.innerText = "NIVEL MANGO"; }
            else { lbl.innerText = "NIVEL AREPA"; }
        }

        function bucle(tiempoActual) {
            if(!activo && !chig.vivo) return;
            const delta = tiempoActual - ultimoTiempo;
            if (delta >= fpsObjetivo) {
                ultimoTiempo = tiempoActual - (delta % fpsObjetivo);
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                if (imgCielo.complete) { bgX_cielo -= vel * 0.1; if(bgX_cielo <= -window.innerWidth) bgX_cielo = 0; ctx.drawImage(imgCielo, Math.floor(bgX_cielo), 0, window.innerWidth + 2, window.innerHeight); ctx.drawImage(imgCielo, Math.floor(bgX_cielo + window.innerWidth), 0, window.innerWidth + 2, window.innerHeight); }
                if (imgSuelo.complete) { bgX_suelo -= vel; if(bgX_suelo <= -window.innerWidth) bgX_suelo = 0; ctx.drawImage(imgSuelo, Math.floor(bgX_suelo), 0, window.innerWidth + 2, window.innerHeight); ctx.drawImage(imgSuelo, Math.floor(bgX_suelo + window.innerWidth), 0, window.innerWidth + 2, window.innerHeight); }
                if(activo) {
                    actualizarNivel();
                    chig.dy += chig.g; chig.y += chig.dy;
                    if(chig.y > chig.suelo) { chig.y = chig.suelo; chig.dy = 0; }
                    frameAnim++;
                    let imgActual = (chig.y < chig.suelo - 10) ? imgC3 : [imgC1, imgC2, imgC3, imgC4][Math.floor(frameAnim / 6) % 4];
                    for(let i = obst.length - 1; i >= 0; i--) {
                        obst[i].x -= vel;
                        let bY = chig.suelo + (chig.h - obst[i].h);
                        if(obst[i].doble) { ctx.drawImage(imgB, obst[i].x, bY, 80, obst[i].h); ctx.drawImage(imgB, (obst[i].x + 80) - 35, bY, 80, obst[i].h); }
                        else { ctx.drawImage(imgB, obst[i].x, bY, obst[i].w, obst[i].h); }
                        if (chig.x + 35 < obst[i].x + obst[i].w - 35 && chig.x + chig.w - 35 > obst[i].x + 35 && chig.y + 35 < bY + obst[i].h && chig.y + chig.h - 15 > bY) morir();
                        if(obst[i].x < -200) { obst.splice(i, 1); score += 10; document.getElementById("score").innerText = score; vel += 0.15; }
                    }
                    ctx.drawImage(imgActual, chig.x, chig.y, chig.w, chig.h);
                } else { ctx.drawImage(imgD, chig.x, chig.y, chig.w, chig.h); }
            }
            requestAnimationFrame(bucle);
        }

        async function verRanking() { 
            document.getElementById("rankingModal").style.display = "flex"; document.getElementById("rankingBody").innerHTML = ""; document.getElementById("loadingRank").style.display = "block";
            try { const res = await fetch(`${URL_SCRIPT}?action=getRanking`); const data = await res.json(); document.getElementById("loadingRank").style.display = "none"; data.forEach((p, i) => { document.getElementById("rankingBody").innerHTML += `<tr><td>${i+1}</td><td>${p.usuario}</td><td>${p.puntaje}</td></tr>`; }); } catch (e) { document.getElementById("loadingRank").innerText = "Error."; } 
        }
        function cerrarRanking() { document.getElementById("rankingModal").style.display = "none"; }
    </script>
</body>
</html>
