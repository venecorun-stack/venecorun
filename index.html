<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - Master Edition</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; }
        
        /* Contenedores de Pantallas */
        #introScreen, #loginMenu, #mainMenu, #gameOverScreen, #rankingModal { 
            position: absolute; width: 100%; height: 100%; background-color: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 900; text-align: center; 
        }

        #introScreen { background-image: url('portada.png'); background-size: contain; background-repeat: no-repeat; background-position: center; cursor: pointer; justify-content: flex-end; }
        #loginMenu, #mainMenu { background-image: url('portada.png'); background-size: contain; background-repeat: no-repeat; background-position: center; display: none; }
        #gameOverScreen { background: rgba(0,0,0,0.95); display: none; }
        
        .login-box { background: rgba(0,0,0,0.9); padding: 25px; border: 3px solid #ffcc00; border-radius: 20px; width: 85%; max-width: 350px; }
        
        /* Botones e Inputs */
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; background: #222; color: white; }
        .btn { padding: 15px 35px; font-size: 18px; font-weight: bold; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0px 5px 0px #b38f00; margin-top: 10px; width: 100%; }
        .btn-ranking { background: #00ffff; box-shadow: 0px 5px 0px #008b8b; margin-top: 15px; }
        .btn-cerrar { background: #ff4444; box-shadow: 0px 5px 0px #8b0000; margin-top: 20px; font-size: 14px; padding: 10px; width: auto; }
        .share-btn { color: white; padding: 10px; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* Estilo Ventana Ranking */
        #rankingModal { background: rgba(0,0,0,0.95); display: none; z-index: 1001; }
        .ranking-content { background: #111; border: 2px solid #ffcc00; padding: 20px; border-radius: 15px; width: 85%; max-width: 400px; max-height: 70vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { color: #ffcc00; border-bottom: 2px solid #ffcc00; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #333; }
        
        /* UI del Juego */
        #ui { position: absolute; top: 10px; left: 10px; z-index: 850; display: none; pointer-events: none; }
        .score-text { font-size: 22px; color: white; text-shadow: 2px 2px 0 #000; margin: 0; }
        #levelContainer { position: absolute; top: 10px; right: 10px; z-index: 800; display: none; }
        #levelText { font-size: 18px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px 0 #000; background: rgba(0,0,0,0.3); padding: 2px 8px; border-radius: 5px; }

        canvas { display: none; image-rendering: -webkit-optimize-contrast; }
    </style>
</head>
<body>

    <div id="introScreen" onclick="clicPortada()">
        <div style="font-size:24px; color:white; margin-bottom:80px; text-shadow: 0 0 15px #ffcc00; background: rgba(0,0,0,0.5); width:100%;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu">
        <div class="login-box">
            <h2 style="color:#ffcc00; margin-top:0;">REGISTRO AIRDROP</h2>
            <input type="text" id="tgUser" placeholder="Usuario">
            <input type="text" id="bnbWallet" placeholder="Wallet BNB BEP20 (MetaMask)">
            <button class="btn" onclick="guardarYEntrar()">LISTO</button>
        </div>
    </div>

    <div id="mainMenu">
        <div class="login-box">
            <h2 id="welcomeText" style="color:#ffcc00; margin-top:0;">¡HOLA!</h2>
            <p id="menuBestScore" style="margin: 0 0 15px 0; color: #00ffff;">Record: 0</p>
            
            <button class="btn" onclick="prepararJuego()">JUGAR</button>
            <button class="btn btn-ranking" onclick="verRanking()">RANKING</button>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;">
                <a href="https://t.me/venecoinu" target="_blank" class="share-btn" style="text-decoration: none; background: #0088cc;">✈ Telegram</a>
                <a href="https://x.com/veneco_toke" target="_blank" class="share-btn" style="text-decoration: none; background: #000; border: 1px solid #555;">𝕏 Twitter</a>
                <a href="https://www.tiktok.com/@venecotoken" target="_blank" class="share-btn" style="text-decoration: none; background: #ff0050;">♪ TikTok</a>
                <a href="https://www.veneco.lol/" target="_blank" class="share-btn" style="text-decoration: none; background: #ffcc00; color: #000;">🌐 Web</a>
            </div>

            <button class="btn btn-cerrar" onclick="cerrarSesion()">CERRAR SESIÓN ✖</button>
        </div>
    </div>

    <div id="rankingModal">
        <div class="ranking-content">
            <h2 style="color:#ffcc00;">TOP 10 PLAYERS</h2>
            <div id="loadingRanking">Cargando datos...</div>
            <table id="rankingTable">
                <thead>
                    <tr><th>#</th><th>Usuario</th><th>Puntos</th></tr>
                </thead>
                <tbody id="rankingBody"></tbody>
            </table>
            <button class="btn" style="margin-top:20px;" onclick="cerrarRanking()">VOLVER</button>
        </div>
    </div>

    <div id="ui">
        <div id="displayUser" style="color:#00ffff; font-size:16px; text-shadow: 1.5px 1.5px 0 #000;"></div>
        <p class="score-text">PUNTOS: <span id="score">0</span></p>
        <p style="color: #ffcc00; font-size: 14px; margin:0;">RECORD: <span id="highScoreText">0</span></p>
    </div>

    <div id="levelContainer"><p id="levelText">PRINCIPIANTE</p></div>

    <div id="gameOverScreen">
        <h1 style="color:#ff4444; font-size:35px;">¡FIN DEL JUEGO!</h1>
        <p style="font-size:24px;">Puntos: <span id="finalScore">0</span></p>
        <button class="btn" onclick="volverAlMenu()">VOLVER AL MENÚ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyb83SGQoXgHh_eWtJzEr39FmnnoiM__y7fH_GEytH5uAqVCczOUufe523OnXhRcSYzYw/exec";

        // Imágenes y Sonidos (Se mantienen igual)
        const imgC = new Image(); imgC.src = 'chiguire.png';
        const imgD = new Image(); imgD.src = 'derrota.png';
        const imgB = new Image(); imgB.src = 'barril.png';
        const imgF = new Image(); imgF.src = 'fondo.png';
        const sndClick = new Audio('click.mp3');
        const sndSalto = new Audio('salto.mp3');
        const sndPerder = new Audio('perder.mp3');
        const musFondo = new Audio('musicafondo.mp3'); musFondo.loop = true;
        const sndIntro = new Audio('intro.mp3'); sndIntro.loop = true;

        let activo = false, score = 0, vel = 11, obst = [], bgX = 0;
        let recordGlobal = localStorage.getItem('venecoRunHighScore') || 0;
        let chig = { x: 80, y: 0, w: 110, h: 110, dy: 0, g: 2.1, salto: -23, suelo: 0, vivo: true };
        let estela = [], nivelActual = "", ultimoTiempo = 0;
        const fpsObjetivo = 1000 / 60; 

        // --- LÓGICA DE FLUJO DE MENÚS ---
        function clicPortada() { 
            sndClick.play(); sndIntro.play(); 
            document.getElementById("introScreen").style.display = "none"; 
            if(localStorage.getItem('venecoUser')) {
                mostrarMenuPrincipal();
            } else {
                document.getElementById("loginMenu").style.display = "flex"; 
            }
        }

        function guardarYEntrar() {
            sndClick.play();
            const u = document.getElementById("tgUser").value;
            const w = document.getElementById("bnbWallet").value;
            if(u.length > 2) {
                localStorage.setItem('venecoUser', u);
                localStorage.setItem('venecoWallet', w);
                document.getElementById("loginMenu").style.display = "none";
                mostrarMenuPrincipal();
            }
        }

        function mostrarMenuPrincipal() {
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("welcomeText").innerText = "¡HOLA, " + localStorage.getItem('venecoUser').toUpperCase() + "!";
            document.getElementById("menuBestScore").innerText = "Tu Record: " + (localStorage.getItem('venecoRunHighScore') || 0);
        }

        function volverAlMenu() {
            document.getElementById("gameOverScreen").style.display = "none";
            canvas.style.display = "none";
            document.getElementById("ui").style.display = "none";
            mostrarMenuPrincipal();
        }

        function prepararJuego() { 
            document.getElementById("mainMenu").style.display = "none";
            sndIntro.pause(); musFondo.play(); 
            canvas.style.display = "block"; 
            document.getElementById("ui").style.display = "block"; 
            document.getElementById("levelContainer").style.display = "block";
            document.getElementById("displayUser").innerText = localStorage.getItem('venecoUser');
            document.getElementById("highScoreText").innerText = recordGlobal;
            ajustar(); iniciar(); 
        }

        async function verRanking() {
            document.getElementById("rankingModal").style.display = "flex";
            document.getElementById("rankingBody").innerHTML = "";
            document.getElementById("loadingRanking").style.display = "block";
            try {
                const response = await fetch(URL_SCRIPT + "?action=getRanking");
                const data = await response.json();
                document.getElementById("loadingRanking").style.display = "none";
                data.forEach((player, index) => {
                    document.getElementById("rankingBody").innerHTML += `<tr><td>${index+1}</td><td>${player.usuario}</td><td>${player.puntaje}</td></tr>`;
                });
            } catch (e) { document.getElementById("loadingRanking").innerText = "Error al cargar."; }
        }

        function cerrarRanking() { document.getElementById("rankingModal").style.display = "none"; }
        function cerrarSesion() { localStorage.clear(); location.reload(); }

        // --- LÓGICA DEL JUEGO (SIN CAMBIOS) ---
        function ajustar() { 
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr); 
            chig.suelo = window.innerHeight - 220; chig.y = chig.suelo;
            chig.x = window.innerWidth < 600 ? 25 : 100;
        }

        function iniciar() { 
            activo = true; chig.vivo = true; score = 0; vel = 11; obst = []; estela = []; 
            ultimoTiempo = performance.now();
            requestAnimationFrame(bucle); 
            setTimeout(spawn, 2000); 
        }

        async function enviarDatosExcel(puntos) {
            const datos = { usuario: localStorage.getItem('venecoUser'), wallet: localStorage.getItem('venecoWallet'), puntaje: puntos };
            try { fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) }); } catch (e) {}
        }

        function morir() { 
            activo = false; chig.vivo = false; musFondo.pause(); sndPerder.play(); 
            if(score > recordGlobal) { recordGlobal = score; localStorage.setItem('venecoRunHighScore', recordGlobal); }
            enviarDatosExcel(score);
            document.getElementById("finalScore").innerText = score; 
            document.getElementById("levelContainer").style.display = "none";
            document.getElementById("gameOverScreen").style.display = "flex"; 
        }

        const saltar = () => { if(activo && chig.y >= chig.suelo - 10) { chig.dy = chig.salto; sndSalto.currentTime = 0; sndSalto.play(); } };
        window.addEventListener("mousedown", saltar);
        window.addEventListener("touchstart", saltar);
        window.addEventListener("keydown", (e) => { if(e.code === "Space") { e.preventDefault(); saltar(); } });

        function spawn() {
            if(!activo) return;
            let esDoble = score >= 200 && Math.random() > 0.6;
            obst.push({ x: window.innerWidth + 150, w: esDoble ? 125 : 80, h: 90, doble: esDoble });
            let delay = Math.max(1100 / (vel * 0.07), esDoble ? 1100 : 700); 
            setTimeout(spawn, delay);
        }

        function bucle(tiempoActual) {
            if(!activo && !chig.vivo) return;
            const delta = tiempoActual - ultimoTiempo;
            if (delta >= fpsObjetivo) {
                ultimoTiempo = tiempoActual - (delta % fpsObjetivo);
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                bgX -= vel * 0.4; if(bgX <= -window.innerWidth) bgX = 0;
                ctx.drawImage(imgF, bgX, 0, window.innerWidth + 2, window.innerHeight);
                ctx.drawImage(imgF, bgX + window.innerWidth, 0, window.innerWidth + 2, window.innerHeight);
                if(activo) {
                    chig.dy += chig.g; chig.y += chig.dy;
                    if(chig.y > chig.suelo) { chig.y = chig.suelo; chig.dy = 0; }
                    for(let i = obst.length - 1; i >= 0; i--) {
                        obst[i].x -= vel;
                        let bY = chig.suelo + (chig.h - obst[i].h);
                        ctx.drawImage(imgB, obst[i].x, bY, obst[i].w, obst[i].h);
                        if (chig.x + 35 < obst[i].x + obst[i].w - 35 && chig.x + chig.w - 35 > obst[i].x + 35 && 
                            chig.y + 35 < bY + obst[i].h && chig.y + chig.h - 15 > bY) morir();
                        if(obst[i].x < -200) { obst.splice(i, 1); score += 10; document.getElementById("score").innerText = score; vel += 0.15; }
                    }
                }
                ctx.drawImage(chig.vivo ? imgC : imgD, chig.x, chig.y, chig.w, chig.h);
            }
            requestAnimationFrame(bucle);
        }
    </script>
</body>
</html>
