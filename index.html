<div id="mainMenu">
        <div id="userProfile">
            <span id="userNameDisplay">Cargando...</span>
            <div id="userPointsDisplay">PUNTOS: <span id="currentScoreMenu">0</span></div>
        </div>
        <div class="play-circle" onclick="prepararJuego()">JUGAR</div>
        <div class="menu-opt" onclick="cargarRanking()"><b>🏆 RANKING TOP 10</b><span>Ver líderes</span></div>
        <div class="menu-opt" onclick="abrirModal('modalAirdrop')"><b>💰 REGISTRAR WALLET</b><span>Wallet BNB</span></div>
        
        <div class="menu-opt" id="btnTGTask" onclick="nuevaTareaTelegram()"><b>📢 UNIRSE A TELEGRAM</b><span>¡Gana +1000 puntos!</span></div>
        
        <div class="menu-opt" style="background: rgba(46, 204, 113, 0.2); border-color: #2ecc71;" onclick="compartirJuego()"><b>🔗 COMPARTIR JUEGO</b><span>Invita a tus amigos</span></div>
    </div>
<script>
        // ... (mantener variables globales y funciones de juego existentes) ...

        // --- NUEVA FUNCIÓN: TAREA TELEGRAM +1000 PTS ---
        async function nuevaTareaTelegram() {
            // Verificar si ya lo hizo en esta sesión para evitar clics repetidos rápidos
            if(localStorage.getItem('taskTGDone') === 'true') {
                alert("Ya reclamaste este bono.");
                return;
            }

            window.open("https://t.me/venecoinu", "_blank");

            // Enviamos la instrucción de sumar 1000 puntos
            await postData({
                accion: "bono_tg",
                usuario: localStorage.getItem('venecoUser'),
                wallet: localStorage.getItem('venecoTGID')
            });

            localStorage.setItem('taskTGDone', 'true');
            alert("¡Felicidades! +1000 Puntos sumados. Se verán reflejados en breve.");
            
            // Actualizar visualmente el botón
            const btn = document.getElementById('btnTGTask');
            if(btn) {
                btn.style.opacity = "0.5";
                btn.onclick = null;
                btn.innerHTML = "<b>✅ COMPLETADO</b><span>+1000 pts recibidos</span>";
            }
            
            // Recargar datos del menú para ver los nuevos puntos
            setTimeout(mostrarMenu, 2500);
        }

        // --- NUEVA FUNCIÓN: COMPARTIR ---
        function compartirJuego() {
            const texto = "¡Mira este juego de Veneco Run! 🏃‍♂️💨 Juega y suma puntos aquí:";
            const url = "https://t.me/venecotoken_bot/venecorun"; // Ajusta el link si es necesario
            
            if (tg.shareExternalLink) {
                // Si estamos en Telegram WebApp, usamos su interfaz nativa
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(texto)}`);
            } else {
                // Fallback para navegadores normales
                window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(texto)}`, '_blank');
            }
        }

        // Modificamos mostrarMenu ligeramente para que oculte el botón si ya se hizo la tarea
        async function mostrarMenu() {
            document.getElementById("loginMenu").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("logoutBtn").style.display = "block";
            const myID = localStorage.getItem('venecoTGID');
            document.getElementById("userNameDisplay").innerText = localStorage.getItem('venecoUser');
            
            try {
                const res = await fetch(URL_SCRIPT + "?tipo=getUserData&id=" + myID);
                const data = await res.json();
                document.getElementById("currentScoreMenu").innerText = data.puntos || 0;
                recordGlobalBD = data.puntos || 0;
                document.getElementById("highScoreText").innerText = recordGlobalBD;
                if(data.wallet) document.getElementById("walletInput").value = data.wallet;
                
                // Si la base de datos dice que ya tiene el bono, desactivamos el botón
                if(data.bono === true) {
                    localStorage.setItem('taskTGDone', 'true');
                    const btn = document.getElementById('btnTGTask');
                    if(btn) {
                        btn.style.opacity = "0.5";
                        btn.onclick = null;
                        btn.innerHTML = "<b>✅ COMPLETADO</b><span>+1000 pts recibidos</span>";
                    }
                }
            } catch(e) { console.log("Cargando perfil..."); }
        }

        // ... (resto de funciones de juego: cargarRanking, guardarWallet, prepararJuego, etc.) ...
    </script>
