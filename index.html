<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Veneco Run - Fase 2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; color: white; }
        
        /* Menú Principal Post-Login */
        #mainMenu { 
            position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a1a, #000);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }

        .play-circle {
            width: 120px; height: 120px; background: #2ecc71; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: white; cursor: pointer;
            box-shadow: 0 0 20px #2ecc71, 0 0 40px #2ecc71;
            border: 4px solid white; animation: pulse 2s infinite; margin-bottom: 40px;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .menu-opt {
            width: 80%; max-width: 300px; background: rgba(255,255,255,0.1);
            margin: 10px 0; padding: 15px; border-radius: 15px; text-align: center;
            cursor: pointer; border: 1px solid #444; transition: 0.3s;
        }
        .menu-opt:hover { background: rgba(255,255,255,0.2); }
        .menu-opt span { display: block; font-size: 12px; color: #aaa; }

        /* Ventanas Modales */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
        }
        .modal-content { background: #222; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; border: 2px solid #ffcc00; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; box-sizing: border-box; }

        /* Estilos base del juego */
        #ui, #introScreen, #loginMenu, #gameOverScreen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 900; }
        #introScreen { background: url('portada.png') center/contain no-repeat #000; justify-content: flex-end; }
        canvas { display: none; }
        .btn { padding: 15px 35px; background: #ffcc00; color: #000; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="introScreen" onclick="clicPortada()">
        <div style="margin-bottom:80px;">TOCA PARA EMPEZAR</div>
    </div>

    <div id="loginMenu" style="display:none;">
        <div style="background:rgba(0,0,0,0.8); padding:30px; border-radius:20px; border:2px solid #ffcc00;">
            <h2>REGISTRO</h2>
            <div id="loginContainer"></div>
        </div>
    </div>

    <div id="mainMenu">
        <div class="play-circle" onclick="prepararJuego()">JUGAR</div>
        
        <div class="menu-opt" onclick="abrirModal('modalRef')">
            👥 REFERIDOS <span>Gana +150 puntos por amigo</span>
        </div>
        
        <div class="menu-opt" onclick="cargarRanking()">
            🏆 RANKING TOP 10 <span>Mira quién lidera</span>
        </div>
        
        <div class="menu-opt" onclick="abrirModal('modalAirdrop')">
            💰 RECIBIR AIRDROP <span>Registra tu Wallet BNB</span>
        </div>
    </div>

    <div id="modalRef" class="modal">
        <div class="modal-content">
            <h3>TUS REFERIDOS</h3>
            <p style="font-size:12px;">Comparte tu link:</p>
            <input type="text" id="refLink" readonly>
            <button class="btn" onclick="copiarRef()">COPIAR LINK</button>
            <button class="btn" style="background:#444; color:white;" onclick="cerrarModales()">CERRAR</button>
        </div>
    </div>

    <div id="modalRank" class="modal">
        <div class="modal-content">
            <h3>TOP 10 LÍDERES</h3>
            <div id="rankList" style="text-align:left; font-size:14px; margin-bottom:15px;">Cargando...</div>
            <button class="btn" onclick="cerrarModales()">CERRAR</button>
        </div>
    </div>

    <div id="modalAirdrop" class="modal">
        <div class="modal-content">
            <h3>REGISTRO WALLET</h3>
            <p style="font-size:12px;">Wallet BNB BEP-20 (Metamask/Trust):</p>
            <input type="text" id="walletInput" placeholder="0x...">
            <button class="btn" onclick="guardarWallet()">REGISTRAR WALLET</button>
            <button class="btn" style="background:#444; color:white;" onclick="cerrarModales()">CERRAR</button>
        </div>
    </div>

    <div id="ui" style="display:none; pointer-events:none;">
        <p>PUNTOS: <span id="score">0</span></p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const URL_SCRIPT = "TU_NUEVA_URL_AQUI";

        // Obtener ID del referente desde la URL de Telegram (si existe)
        const params = new URLSearchParams(window.location.search);
        const inviter = params.get('tgWebAppStartParam');

        function clicPortada() {
            document.getElementById("introScreen").style.display = "none";
            if(localStorage.getItem('venecoUser')) {
                mostrarMenu();
            } else {
                verificarEntorno();
                document.getElementById("loginMenu").style.display = "flex";
            }
        }

        function verificarEntorno() {
            const container = document.getElementById("loginContainer");
            if (tg.initDataUnsafe.user) {
                container.innerHTML = `<button class="btn" onclick="loginTG()">INICIAR CON TELEGRAM</button>`;
            } else {
                container.innerHTML = `<a href="https://t.me/venecotoken_bot/venecorun" class="btn">ABRIR EN TELEGRAM</a>`;
            }
        }

        function loginTG() {
            const u = tg.initDataUnsafe.user;
            localStorage.setItem('venecoUser', u.username ? "@" + u.username : u.first_name);
            localStorage.setItem('venecoTGID', u.id.toString());
            
            // Enviar registro inicial con referido
            fetch(URL_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    accion: "puntos",
                    usuario: localStorage.getItem('venecoUser'),
                    wallet: localStorage.getItem('venecoTGID'),
                    puntaje: 0,
                    invitadoPor: inviter ? "ID: " + inviter : ""
                })
            });
            mostrarMenu();
        }

        function mostrarMenu() {
            document.getElementById("loginMenu").style.display = "none";
            document.getElementById("mainMenu").style.display = "flex";
            document.getElementById("refLink").value = "https://t.me/venecotoken_bot/venecorun?startapp=" + localStorage.getItem('venecoTGID');
        }

        function abrirModal(id) { document.getElementById(id).style.display = "flex"; }
        function cerrarModales() { document.querySelectorAll('.modal').forEach(m => m.style.display = "none"); }

        function copiarRef() {
            const copyText = document.getElementById("refLink");
            copyText.select();
            document.execCommand("copy");
            tg.showAlert("¡Link copiado! Pásalo a tus amigos.");
        }

        async function cargarRanking() {
            abrirModal('modalRank');
            document.getElementById("rankList").innerHTML = "Cargando...";
            try {
                const res = await fetch(URL_SCRIPT);
                const data = await res.json();
                let html = "";
                data.forEach((user, i) => {
                    html += `<p>${i+1}. ${user.nombre} - ${user.puntos} pts</p>`;
                });
                document.getElementById("rankList").innerHTML = html;
            } catch (e) { document.getElementById("rankList").innerHTML = "Error al cargar ranking."; }
        }

        function guardarWallet() {
            const wall = document.getElementById("walletInput").value;
            if(wall.length < 20) return alert("Wallet inválida");
            
            fetch(URL_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    accion: "wallet",
                    wallet: localStorage.getItem('venecoTGID'),
                    direccion: wall
                })
            });
            tg.showAlert("¡Wallet registrada en la base de datos!");
            cerrarModales();
        }

        // --- LÓGICA DE JUEGO SIMPLIFICADA (Integrar con tu bucle anterior) ---
        function prepararJuego() {
            document.getElementById("mainMenu").style.display = "none";
            // Aquí llamas a tu función iniciar() de antes
            alert("Iniciando juego... (conecta aquí tu bucle de chigüire)");
        }
    </script>
</body>
</html>
